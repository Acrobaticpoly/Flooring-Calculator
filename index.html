<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

  :root{
    --canvas:#F4F1EA;
    --card:#ffffff;
    --card-soft:#ffffff;
    --ink:#111111;
    --ink-mute:#57534a;
    --lime:#C6F135;
    --lime-ink:#1c2400;
    --pink:#FF6FA0;
    --pink-ink:#3a0016;
    --purple:#7B5CFA;
    --carpet:#FF6FA0;
    --timber:#C6F135;
    --tile:#7B5CFA;
    --border-w:2.5px;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-ink:4px 4px 0 var(--ink);
    --shadow-ink-sm:2.5px 2.5px 0 var(--ink);
  }

  * { box-sizing:border-box; }

  #floorapp {
    font-family:'Plus Jakarta Sans', -apple-system, sans-serif;
    background:
      linear-gradient(rgba(17,17,17,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,17,0.06) 1px, transparent 1px),
      var(--canvas);
    background-size:26px 26px;
    color:var(--ink);
    padding:26px 18px 110px;
    min-height:100%;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #floorapp .wrap{ max-width:960px; margin:0 auto; }
  #floorapp *{ box-sizing:border-box; }

  #floorapp h1{
    font-size:26px; font-weight:800; letter-spacing:-0.01em; text-transform:uppercase; margin:0;
    text-shadow:3px 3px 0 var(--lime);
  }
  #floorapp .title-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  #floorapp .version-tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; color:var(--ink);
    background:var(--card); border:1.5px solid var(--ink); border-radius:999px; padding:3px 10px;
  }
  #floorapp .subhead{ color:var(--ink-mute); font-size:13px; font-weight:600; margin:0 0 22px; }

  @keyframes riseIn {
    from { opacity:0; transform:translateY(10px); }
    to { opacity:1; transform:translateY(0); }
  }
  @media (prefers-reduced-motion: reduce){
    #floorapp *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  #floorapp .stagger{ opacity:0; animation:riseIn 0.55s cubic-bezier(.2,.8,.2,1) forwards; }

  /* ---------- Toolbar ---------- */
  #floorapp .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; flex-wrap:wrap; }
  #floorapp .pill-select{
    font-family:inherit; font-size:12px; font-weight:700; padding:8px 12px; border-radius:var(--radius-sm);
    border:var(--border-w) solid var(--ink); background:var(--card); color:var(--ink);
    box-shadow:var(--shadow-ink-sm); cursor:pointer;
  }
  #floorapp .pill-btn{
    font-family:inherit; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em;
    padding:9px 15px; border-radius:var(--radius-sm);
    border:var(--border-w) solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer;
    box-shadow:var(--shadow-ink-sm);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  #floorapp .pill-btn:hover{ background:var(--lime); }
  #floorapp .pill-btn:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }

  /* ---------- Hero dial ---------- */
  #floorapp .hero{
    position:relative; border-radius:var(--radius-lg); overflow:visible;
    background:var(--card); border:var(--border-w) solid var(--ink); box-shadow:var(--shadow-ink);
    padding:26px 24px; margin-bottom:22px;
    display:flex; align-items:center; gap:26px; flex-wrap:wrap;
  }
  #floorapp .orb{
    position:relative; width:150px; height:150px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
  }
  #floorapp .orb::before{
    content:''; position:absolute; width:118px; height:118px; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(12deg);
    background:var(--lime); border:var(--border-w) solid var(--ink); border-radius:26px;
    animation:wiggle 5s ease-in-out infinite;
  }
  @keyframes wiggle{
    0%,100%{ transform:translate(-50%,-50%) rotate(12deg); }
    50%{ transform:translate(-50%,-50%) rotate(6deg); }
  }
  #floorapp .orb-ring{
    position:relative; width:112px; height:112px; border-radius:50%;
    background:var(--card); border:var(--border-w) solid var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:var(--shadow-ink-sm);
  }
  #floorapp .orb-ring svg{ position:absolute; inset:-2.5px; width:112px; height:112px; transform:rotate(-90deg); }
  #floorapp .orb-figure{ position:relative; z-index:1; }
  #floorapp .orb-figure .num{ font-family:'JetBrains Mono', monospace; font-size:18px; font-weight:700; letter-spacing:-0.02em; }
  #floorapp .orb-figure .cur{ font-size:10px; color:var(--ink-mute); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }

  #floorapp .hero-copy{ flex:1; min-width:220px; }
  #floorapp .hero-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-mute); font-weight:800; margin-bottom:6px; }
  #floorapp .hero-total{ font-family:'JetBrains Mono', monospace; font-size:38px; font-weight:600; letter-spacing:-0.02em; line-height:1; margin-bottom:10px; }
  #floorapp .hero-breakdown{ display:flex; gap:8px; flex-wrap:wrap; }
  #floorapp .hero-chip{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink); font-weight:700;
    border:1.5px solid var(--ink); border-radius:999px; padding:4px 10px 4px 8px; background:var(--card);
  }
  #floorapp .hero-chip .dot{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--ink); }

  /* ---------- Compare panel ---------- */
  #floorapp .section-title{ display:flex; align-items:baseline; justify-content:space-between; margin:6px 0 12px; }
  #floorapp .section-title h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; color:var(--ink); margin:0; }
  #floorapp .section-hint{ font-size:11.5px; color:var(--ink-mute); font-weight:600; }

  #floorapp .compare-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
  #floorapp .compare-card{
    position:relative; border-radius:var(--radius-md); padding:18px 16px 16px;
    border:var(--border-w) solid var(--ink); box-shadow:var(--shadow-ink);
    overflow:visible; min-height:168px; display:flex; flex-direction:column; justify-content:space-between;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #floorapp .compare-card:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  #floorapp .compare-card.carpet{ background:var(--carpet); color:#111; }
  #floorapp .compare-card.timber{ background:var(--timber); color:#111; }
  #floorapp .compare-card.tile{ background:var(--tile); color:#fff; }

  #floorapp .compare-card .best-tag{
    position:absolute; top:-12px; right:14px; background:var(--lime); color:var(--lime-ink);
    border:1.5px solid var(--ink);
    font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 9px; border-radius:999px; opacity:0; transform:rotate(-6deg) scale(0.7);
    transition:all .25s cubic-bezier(.2,1.4,.4,1);
  }
  #floorapp .compare-card.is-best .best-tag{ opacity:1; transform:rotate(-6deg) scale(1); }

  #floorapp .compare-name-input{
    font-family:inherit; font-weight:800; font-size:15px; text-transform:uppercase; color:inherit; background:transparent;
    border:none; border-bottom:2px dashed currentColor; padding:2px 0; width:78%; opacity:0.92;
  }
  #floorapp .compare-name-input:focus{ outline:none; border-bottom-style:solid; opacity:1; }
  #floorapp .compare-name-input::placeholder{ color:inherit; opacity:0.6; }

  #floorapp .compare-price-row{ display:flex; align-items:center; gap:6px; margin-top:10px; }
  #floorapp .compare-price-row .cur{ font-size:13px; font-weight:700; }
  #floorapp .compare-price-input{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--ink); border-radius:8px;
    padding:5px 8px; width:80px;
  }
  #floorapp .compare-price-input::placeholder{ color:var(--ink-mute); }
  #floorapp .compare-per-m2{ font-size:10.5px; font-weight:700; opacity:0.85; }

  #floorapp .compare-total{ margin-top:14px; }
  #floorapp .compare-total .t-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; font-weight:800; opacity:0.85; }
  #floorapp .compare-total .t-figure{ font-family:'JetBrains Mono', monospace; font-size:21px; font-weight:700; }

  #floorapp .bar-track{ height:10px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); margin-top:8px; overflow:hidden; }
  #floorapp .bar-fill{ height:100%; border-radius:999px; background:var(--ink); width:0%; transition:width .6s cubic-bezier(.2,.8,.2,1); }

  /* ---------- Room list ---------- */
  #floorapp .floor-block{ margin-bottom:24px; }
  #floorapp .floor-title{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:var(--border-w) solid var(--ink); padding-bottom:7px; margin-bottom:11px; }
  #floorapp .floor-title h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; margin:0; }
  #floorapp .floor-subtotal{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; }

  #floorapp .room-card{
    position:relative;
    background:var(--card-soft);
    border:1.5px solid var(--ink); border-radius:var(--radius-sm);
    padding:14px 44px 14px 14px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:2.5px 2.5px 0 rgba(17,17,17,0.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #floorapp .room-card:hover{ transform:translate(-1.5px,-1.5px); box-shadow:4px 4px 0 var(--ink); }
  #floorapp .room-card.estimated{ border-left:5px solid var(--pink); }
  #floorapp .room-card-header{ display:flex; align-items:center; gap:10px; }
  #floorapp .room-card-measurements{ display:grid; grid-template-columns:0.85fr 1.15fr 0.75fr 0.7fr auto; gap:10px; align-items:end; }
  #floorapp .room-card-product{ display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; border-top:1px dashed var(--line); padding-top:10px; }
  #floorapp .product-link-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px; flex-shrink:0;
    border:1.5px solid var(--ink); border-radius:8px; background:var(--card); color:var(--ink);
    text-decoration:none; font-size:15px; transition:background .12s ease;
  }
  #floorapp .product-link-btn:hover{ background:var(--lime); }
  #floorapp .product-link-btn.disabled{ opacity:0.3; pointer-events:none; }

  #floorapp .include-toggle{
    width:24px; height:24px; border-radius:7px; border:1.5px solid var(--ink); background:var(--card);
    cursor:pointer; display:flex; align-items:center; justify-content:center; align-self:center; flex-shrink:0;
    transition:all .12s ease;
  }
  #floorapp .include-toggle.on{ background:var(--lime); border-color:var(--ink); }
  #floorapp .include-toggle.on::after{ content:'✓'; color:var(--ink); font-size:14px; font-weight:800; }

  #floorapp .field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  #floorapp .field label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-mute); font-weight:800; }
  #floorapp input[type="text"], #floorapp input[type="number"], #floorapp input[type="url"]{
    font-family:inherit; font-size:13px; padding:7px 8px; border:1.5px solid var(--ink);
    border-radius:8px; background:#fff; color:var(--ink); width:100%;
  }
  #floorapp input[type="number"]{ font-family:'JetBrains Mono', monospace; }
  #floorapp input:focus{ outline:2.5px solid var(--lime); outline-offset:1px; }
  #floorapp .room-name-input{ font-weight:700; font-size:14px; flex:1; }

  #floorapp .est-tag{
    font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em; color:var(--pink-ink);
    background:var(--pink); border:1px solid var(--ink); padding:2px 7px; border-radius:999px; white-space:nowrap; flex-shrink:0;
  }

  #floorapp .cost-out{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; color:var(--ink); text-align:right; padding-bottom:7px; }
  #floorapp .cost-out .lbl{ display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-mute); font-weight:800; font-family:'Plus Jakarta Sans', sans-serif; margin-bottom:4px; }
  #floorapp .cost-out .cur{ font-size:11px; color:var(--ink-mute); font-weight:600; margin-right:2px; }

  #floorapp .remove-btn{
    position:absolute; top:10px; right:10px;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink); width:26px; height:26px;
    border-radius:8px; cursor:pointer; font-size:14px; line-height:1; font-weight:800;
  }
  #floorapp .remove-btn:hover{ background:var(--pink); }

  #floorapp .add-room-btn{
    width:100%; padding:10px; border:1.5px dashed var(--ink); background:transparent; color:var(--ink-mute);
    border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; font-family:inherit; margin-top:2px;
  }
  #floorapp .add-room-btn:hover{ border-style:solid; color:var(--ink); background:rgba(198,241,53,0.35); }

  #floorapp .save-note{ font-size:11px; color:var(--ink-mute); font-weight:600; font-style:normal; margin-top:6px; font-family:'JetBrains Mono', monospace; }

  @media (max-width:760px){
    #floorapp .compare-grid{ grid-template-columns:1fr; }
    #floorapp .room-card-measurements{ grid-template-columns:1fr 1fr; }
    #floorapp .room-card-product{ grid-template-columns:1fr; }
    #floorapp .cost-out{ text-align:left; grid-column:1/-1; border-top:1px dashed var(--ink); padding-top:8px; }
    #floorapp .remove-btn{ grid-column:1/-1; justify-self:end; }
    #floorapp .hero{ flex-direction:column; text-align:center; }
    #floorapp .hero-breakdown{ justify-content:center; }
  }

  #floorapp .print-header{ display:none; }
  #floorapp .file-hidden-input{ display:none; }

  @media print {
    body *{ visibility:hidden; }
    #floorapp, #floorapp *{ visibility:visible; }
    #floorapp{ position:absolute; left:0; top:0; width:100%; padding:0 6px; background:#fff !important; }
    #floorapp .toolbar, #floorapp .add-room-btn, #floorapp .remove-btn, #floorapp .best-tag,
    #floorapp .include-toggle, #floorapp .save-note{ display:none !important; }
    #floorapp .print-header{ display:block; margin-bottom:16px; }
    #floorapp .print-header h1{ font-size:19px; margin:0 0 3px; }
    #floorapp .print-header .meta{ font-size:11px; color:#555; }
    #floorapp .stagger{ opacity:1 !important; animation:none !important; }
    #floorapp h1{ text-shadow:none !important; }
    #floorapp .hero{ border:1.5px solid #ccc; box-shadow:none !important; background:#fff !important; }
    #floorapp .orb::before{ display:none !important; }
    #floorapp .orb-ring{ box-shadow:none !important; }
    #floorapp .compare-card{ background:#fff !important; color:#111 !important; border:1.5px solid #ccc !important; box-shadow:none !important; break-inside:avoid; }
    #floorapp .compare-card .compare-name-input, #floorapp .compare-price-input{ color:#111 !important; background:#f4f4f2 !important; border:1px solid #ccc !important; }
    #floorapp .compare-per-m2, #floorapp .compare-price-row .cur{ color:#333 !important; }
    #floorapp .t-label, #floorapp .t-figure{ color:#111 !important; }
    #floorapp .bar-track{ background:#eee !important; border-color:#ccc !important; }
    #floorapp .bar-fill{ background:#333 !important; }
    #floorapp .room-card{ background:#fff !important; box-shadow:none !important; border:1px solid #ddd !important; break-inside:avoid; }
    #floorapp .room-card:hover, #floorapp .compare-card:hover{ transform:none !important; box-shadow:none !important; }
    #floorapp input{ border:1px solid #ddd !important; background:#fff !important; color:#111 !important; }
    #floorapp .floor-title{ break-after:avoid; }
  }
</style>

<div id="floorapp">
  <div class="wrap"><div id="root">Loading…</div></div>
</div>

<script>
(function(){

  const DEFAULT_ROOMS = [
    { id:'r1', floor:'First Floor', name:'Bedroom 1', area:14.41, flooring:'Carpet', price:0, wastage:10, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r2', floor:'First Floor', name:'Study', area:10.33, flooring:'Carpet', price:0, wastage:10, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r3', floor:'First Floor', name:'Bedroom 2', area:6.34, flooring:'Carpet', price:0, wastage:15, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r4', floor:'First Floor', name:'Bedroom 3', area:6.13, flooring:'Carpet', price:0, wastage:15, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r5', floor:'First Floor', name:'Family Bathroom', area:6.10, flooring:'Vinyl / Tile', price:0, wastage:15, estimated:true, include:false, manufacturer:'', productLink:'' },
    { id:'r6', floor:'First Floor', name:'WC / Cloakroom', area:1.70, flooring:'Vinyl / Tile', price:0, wastage:15, estimated:true, include:false, manufacturer:'', productLink:'' },
    { id:'r7', floor:'Ground Floor', name:'Reception Room', area:14.34, flooring:'Carpet', price:0, wastage:15, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r8', floor:'Ground Floor', name:'Kitchen / Breakfast Room', area:24.05, flooring:'LVT / Hard flooring', price:0, wastage:10, estimated:false, include:false, manufacturer:'', productLink:'' },
    { id:'r9', floor:'Ground Floor', name:'Dining Room', area:12.69, flooring:'LVT / Hard flooring', price:0, wastage:10, estimated:false, include:true, manufacturer:'', productLink:'' },
    { id:'r10', floor:'Ground Floor', name:'Porch', area:1.85, flooring:'Tile', price:0, wastage:15, estimated:true, include:false, manufacturer:'', productLink:'' },
    { id:'r11', floor:'Ground Floor', name:'WC / Cloakroom', area:3.10, flooring:'Vinyl / Tile', price:0, wastage:15, estimated:true, include:false, manufacturer:'', productLink:'' },
    { id:'r12', floor:'Outbuilding', name:'Office', area:8.63, flooring:'LVT / Hard flooring', price:0, wastage:10, estimated:false, include:false, manufacturer:'', productLink:'' },
  ];

  const DEFAULT_COMPARE = [
    { id:'carpet', name:'Carpet', price:0, cls:'carpet' },
    { id:'timber', name:'Timber', price:0, cls:'timber' },
    { id:'tile', name:'Tile', price:0, cls:'tile' },
  ];

  const FLOOR_COLORS = { 'First Floor':'#FF6FA0', 'Ground Floor':'#7B5CFA', 'Outbuilding':'#C6F135' };

  const ROOMS_KEY = 'flooring-calc-rooms-v2';
  const COMPARE_KEY = 'flooring-calc-compare-v2';
  const CURRENCY_KEY = 'flooring-calc-currency-v1';

  const root = document.getElementById('root');
  let rooms = null, compareOptions = null, currency = '£';
  let displayedTotal = 0; // for count-up animation
  let displayedCompareTotals = {};
  let nextIdNum = 100;
  let rafHandle = null;

  function fmt(n){ return (Math.round(n*100)/100).toLocaleString('en-GB', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function roomCost(r, priceOverride){
    const area = Number(r.area)||0, price = Number(priceOverride!==undefined?priceOverride:r.price)||0, wastage = Number(r.wastage)||0;
    return area*(1+wastage/100)*price;
  }

  // ---- debounced, retrying save so a slow/flaky storage call never interrupts typing ----
  // Failures are handled silently here — nothing is thrown, and nothing goes to console.error,
  // since this sandbox surfaces console.error as a visible error even when it's already handled.
  function makeSaver(key, getValue){
    let timer = null;
    let retryTimer = null;
    function setStatus(html){
      const el = document.getElementById('save-status');
      if(el) el.innerHTML = html;
    }
    function scheduleRetry(delayMs, attemptNum){
      if(retryTimer) clearTimeout(retryTimer);
      retryTimer = setTimeout(()=>attempt(attemptNum), delayMs);
    }
    async function attempt(attemptNum){
      try{
        await window.storage.set(key, JSON.stringify(getValue()));
        setStatus('Saved');
      }catch(e){
        // Keep trying quietly with backoff, capped at 30s between attempts — your edits stay
        // in the app either way, this only affects whether they persist between sessions.
        const delay = Math.min(30000, 1500 * Math.pow(1.7, attemptNum));
        setStatus('Working on saving\u2026 (your changes are safe in this tab) <a href="#" id="retry-now-link" style="color:inherit; text-decoration:underline;">retry now</a>');
        const link = document.getElementById('retry-now-link');
        if(link) link.addEventListener('click', (ev)=>{ ev.preventDefault(); if(retryTimer) clearTimeout(retryTimer); attempt(0); });
        scheduleRetry(delay, attemptNum + 1);
      }
    }
    return function schedule(){
      setStatus('Saving\u2026');
      if(timer) clearTimeout(timer);
      if(retryTimer) clearTimeout(retryTimer);
      timer = setTimeout(()=>attempt(0), 500);
    };
  }
  const scheduleSaveRooms = makeSaver(ROOMS_KEY, ()=>rooms);
  const scheduleSaveCompare = makeSaver(COMPARE_KEY, ()=>compareOptions);
  const scheduleSaveCurrency = makeSaver(CURRENCY_KEY, ()=>currency);

  async function load(){
    try{ const res = await window.storage.get(ROOMS_KEY); rooms = res ? JSON.parse(res.value) : DEFAULT_ROOMS.map(r=>({...r})); }
    catch(e){ rooms = DEFAULT_ROOMS.map(r=>({...r})); }
    try{ const res = await window.storage.get(COMPARE_KEY); compareOptions = res ? JSON.parse(res.value) : DEFAULT_COMPARE.map(c=>({...c})); }
    catch(e){ compareOptions = DEFAULT_COMPARE.map(c=>({...c})); }
    try{ const c = await window.storage.get(CURRENCY_KEY); currency = c ? JSON.parse(c.value) : '£'; }
    catch(e){ currency = '£'; }
    compareOptions.forEach(c => displayedCompareTotals[c.id] = 0);
    render();
  }

  // Field edits (typing, toggling include) update the model and repaint numbers in place —
  // no full rebuild, so focus/scroll/caret position are never disturbed.
  function updateRoom(id, field, value){ const r = rooms.find(x=>x.id===id); if(!r) return; r[field]=value; scheduleSaveRooms(); recompute(); }
  function toggleInclude(id){
    const r = rooms.find(x=>x.id===id); if(!r) return;
    r.include = !r.include;
    const btn = document.querySelector(`[data-toggle-include="${id}"]`);
    if(btn) btn.classList.toggle('on', r.include);
    scheduleSaveRooms(); recompute();
  }
  function updateCompare(id, field, value){ const c = compareOptions.find(x=>x.id===id); if(!c) return; c[field]=value; scheduleSaveCompare(); recompute(); }

  // Adding/removing a room now inserts or removes just that one card, instead of rebuilding
  // the whole page — keeps everything else on screen completely undisturbed, no flash.
  function removeRoom(id){
    rooms = rooms.filter(x=>x.id!==id);
    scheduleSaveRooms();
    const card = document.getElementById('room-'+id);
    if(card) card.remove(); else { render(); return; }
    recompute();
  }
  function addRoom(floor){
    nextIdNum++;
    const newRoom = { id:'custom'+nextIdNum, floor, name:'New room', area:0, flooring:'', price:0, wastage:10, estimated:false, include:true, manufacturer:'', productLink:'' };
    rooms.push(newRoom);
    scheduleSaveRooms();

    const floorBlock = document.querySelector(`.floor-block[data-floor="${floor}"]`);
    if(floorBlock){
      const addBtn = floorBlock.querySelector('.add-room-btn');
      const temp = document.createElement('div');
      temp.innerHTML = buildRoomCardHtml(newRoom).trim();
      const newCardEl = temp.firstElementChild;
      if(addBtn) floorBlock.insertBefore(newCardEl, addBtn); else floorBlock.appendChild(newCardEl);
      wireRoomCard(newCardEl);
      newCardEl.scrollIntoView({ block:'nearest', behavior:'smooth' });
      recompute();
    } else {
      render(); // fallback: rebuild if the DOM is in an unexpected state
    }
  }
  function resetDefaults(){
    if(!confirm('Reset all rooms, prices and compare options back to defaults? This clears anything custom you have added.')) return;
    rooms = DEFAULT_ROOMS.map(r=>({...r})); compareOptions = DEFAULT_COMPARE.map(c=>({...c}));
    scheduleSaveRooms(); scheduleSaveCompare(); render();
  }

  // ---- Minimal, dependency-free PDF writer -----------------------------------------
  // Builds a valid PDF byte-for-byte by hand (base-14 Helvetica/Courier fonts only,
  // no embedding needed), so PDF export never depends on fetching any external script.
  const WINANSI_MAP = { '\u20AC':0x80, '\u2018':0x91, '\u2019':0x92, '\u201C':0x93, '\u201D':0x94, '\u2013':0x96, '\u2014':0x97 };
  function toWinAnsiBinaryString(str){
    let out = '';
    for(const ch of String(str)){
      const code = ch.codePointAt(0);
      let byte;
      if(code < 0x80) byte = code;
      else if(WINANSI_MAP[ch] !== undefined) byte = WINANSI_MAP[ch];
      else if(code >= 0xA0 && code <= 0xFF) byte = code;
      else byte = 0x3F; // '?' fallback for anything we can't map safely
      out += String.fromCharCode(byte);
    }
    return out;
  }
  function pdfEscapeBinary(binStr){
    return binStr.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');
  }

  function createMiniPdf(){
    const pageWidth = 595.28, pageHeight = 841.89; // A4 in points
    const marginBottom = 40;
    let pages = [];
    let curOps = [];
    let y = 50; // distance from top of page (top-down, like screen coords); converted to PDF's bottom-up y when drawing
    let font = 'reg', size = 10, colorOp = '0.09 0.08 0.06 rg';

    function newPage(){ pages.push(curOps); curOps = []; y = 50; }
    function ensureSpace(extra){ if(y + extra > pageHeight - marginBottom) newPage(); }
    function setFont(key){ font = key; }
    function setSize(pt){ size = pt; }
    function setColor(r,g,b){ colorOp = `${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} rg`; }
    function widthOf(str){
      // Courier is fixed-pitch (0.6em/glyph) so this is exact for our table font;
      // Helvetica uses a conservative average — only used for short, known headings, never truncated against.
      return String(str).length * size * (font === 'mono' || font === 'monoBold' ? 0.6 : 0.52);
    }
    function fitText(str, maxW){
      str = String(str);
      if(widthOf(str) <= maxW) return str;
      let t = str;
      while(t.length > 1 && widthOf(t+'...') > maxW) t = t.slice(0,-1);
      return t + '...';
    }
    function text(str, x, customY){
      const fontKey = { reg:'F1', bold:'F2', mono:'F3', monoBold:'F4' }[font] || 'F1';
      const yy = customY !== undefined ? customY : y;
      const bin = pdfEscapeBinary(toWinAnsiBinaryString(str));
      curOps.push(`BT /${fontKey} ${size} Tf ${colorOp} ${x.toFixed(2)} ${(pageHeight-yy).toFixed(2)} Td (${bin}) Tj ET`);
    }
    function hline(x1, x2, customY){
      const yy = customY !== undefined ? customY : y;
      curOps.push(`0.78 0.78 0.78 RG 0.75 w ${x1.toFixed(2)} ${(pageHeight-yy).toFixed(2)} m ${x2.toFixed(2)} ${(pageHeight-yy).toFixed(2)} l S`);
    }
    function advance(dy){ y += dy; }

    function build(){
      newPage(); // flush current page
      let out = '%PDF-1.4\n%\u00E2\u00E3\u00CF\u00D3\n';
      const offsets = [0];
      const catalogNum = 1, pagesNum = 2, fRegNum = 3, fBoldNum = 4, fMonoNum = 5, fMonoBoldNum = 6;
      let nextNum = 7;
      const pageNums = [], contentNums = [];
      pages.forEach(()=>{ contentNums.push(nextNum++); pageNums.push(nextNum++); });

      function writeObj(num, body){
        offsets[num] = out.length;
        out += `${num} 0 obj\n${body}\nendobj\n`;
      }

      writeObj(catalogNum, `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
      writeObj(pagesNum, `<< /Type /Pages /Kids [${pageNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageNums.length} >>`);
      writeObj(fRegNum, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
      writeObj(fBoldNum, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
      writeObj(fMonoNum, `<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>`);
      writeObj(fMonoBoldNum, `<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>`);

      pages.forEach((ops, i)=>{
        const stream = ops.join('\n');
        writeObj(contentNums[i], `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
        writeObj(pageNums[i], `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fRegNum} 0 R /F2 ${fBoldNum} 0 R /F3 ${fMonoNum} 0 R /F4 ${fMonoBoldNum} 0 R >> >> /Contents ${contentNums[i]} 0 R >>`);
      });

      const xrefStart = out.length;
      const total = nextNum;
      out += `xref\n0 ${total}\n0000000000 65535 f \n`;
      for(let n=1; n<total; n++){
        out += `${String(offsets[n]).padStart(10,'0')} 00000 n \n`;
      }
      out += `trailer\n<< /Size ${total} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;

      const bytes = new Uint8Array(out.length);
      for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }

    return {
      get y(){ return y; }, set y(v){ y = v; },
      pageWidth, pageHeight, ensureSpace, setFont, setSize, setColor, widthOf, fitText, text, hline, advance, build,
    };
  }

  function generatePDF(){
    const doc = createMiniPdf();
    const marginX = 40;
    const lineH = 14;

    function h1(str){ doc.ensureSpace(28); doc.setFont('bold'); doc.setSize(18); doc.setColor(23,20,15); doc.text(str, marginX); doc.advance(24); }
    function h2(str){
      doc.ensureSpace(22);
      doc.setFont('bold'); doc.setSize(11.5); doc.setColor(23,20,15);
      doc.text(str.toUpperCase(), marginX); doc.advance(4);
      doc.hline(marginX, doc.pageWidth - marginX); doc.advance(14);
    }
    function metaLine(str){ doc.ensureSpace(16); doc.setFont('reg'); doc.setSize(9.5); doc.setColor(110,105,95); doc.text(str, marginX); doc.advance(16); }
    function row(cols, widths, opts){
      opts = opts || {};
      doc.ensureSpace(lineH);
      doc.setFont(opts.bold ? 'monoBold' : 'mono');
      doc.setSize(9.5);
      const col = opts.color || [35,32,28];
      doc.setColor(col[0], col[1], col[2]);
      let x = marginX;
      cols.forEach((c, i)=>{ doc.text(doc.fitText(c, widths[i]-6), x); x += widths[i]; });
      doc.advance(lineH);
    }

    const { floors, grandTotal, floorTotals, includedRooms, includedArea, compareTotals, minTotal } = computeAll();

    h1('Flooring Cost Report');
    metaLine(`Generated ${new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })} \u00b7 figures in ${currency}, estimated from floor plan measurements`);
    doc.advance(4);

    h2('Estimated Total');
    doc.setFont('bold'); doc.setSize(22); doc.setColor(23,20,15);
    doc.text(`${currency}${fmt(grandTotal)}`, marginX); doc.advance(24);
    doc.setFont('reg'); doc.setSize(9.5); doc.setColor(90,85,78);
    floors.filter(f=>floorTotals[f]).forEach(f=>{ doc.ensureSpace(14); doc.text(`${f}: ${currency}${fmt(floorTotals[f])}`, marginX); doc.advance(14); });
    doc.advance(10);

    h2('Compare Flooring Types');
    metaLine(`Based on ${includedRooms.length} room${includedRooms.length===1?'':'s'} ticked \u00b7 ${includedArea.toFixed(1)} m\u00b2`);
    const compW = [160,110,110,100];
    row(['Flooring','Price / m2','Est. total',''], compW, {bold:true});
    compareOptions.forEach(c=>{
      const total = compareTotals[c.id];
      const isBest = minTotal!==null && Number(c.price)>0 && total===minTotal;
      row([c.name || 'Flooring', `${currency}${fmt(c.price)}`, `${currency}${fmt(total)}`, isBest?'Best value':''], compW, isBest ? { color:[31,109,74], bold:true } : {});
    });
    doc.advance(8);

    floors.forEach(floor=>{
      const floorRooms = rooms.filter(r=>r.floor===floor);
      if(floorRooms.length===0) return;
      h2(floor);
      const colW = [135,80,50,60,55,45,60];
      row(['Room','Manufacturer','Area m2','Flooring','Price/m2','Waste','Cost'], colW, {bold:true});
      let floorTotal = 0;
      floorRooms.forEach(r=>{
        const cost = roomCost(r); floorTotal += cost;
        row([r.name + (r.estimated?' (est.)':''), r.manufacturer||'-', Number(r.area).toFixed(2), r.flooring||'-', `${currency}${fmt(r.price)}`, r.wastage+'%', `${currency}${fmt(cost)}`], colW);
      });
      doc.ensureSpace(lineH+4);
      doc.setFont('bold'); doc.setSize(9.5); doc.setColor(23,20,15);
      doc.text(`Subtotal: ${currency}${fmt(floorTotal)}`, marginX); doc.advance(20);
    });

    const roomsWithLinks = rooms.filter(r=>r.productLink);
    if(roomsWithLinks.length){
      doc.advance(4);
      h2('Product Links');
      const linkColW = [165,350];
      row(['Room','Link'], linkColW, {bold:true});
      roomsWithLinks.forEach(r=>{
        row([r.name, normalizeUrl(r.productLink)], linkColW);
      });
    }

    const bytes = doc.build();
    const blob = new Blob([bytes], { type:'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Flooring_Calculator_App_Report.pdf';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function exportData(){
    const payload = { version:2, exportedAt:new Date().toISOString(), currency, rooms, compareOptions };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Flooring_Calculator_App_Data.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }

  function triggerImport(){
    const inp = document.getElementById('import-file-input');
    if(inp) inp.click();
  }

  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.rooms) || data.rooms.length === 0) throw new Error('missing rooms');

        const cleanRooms = data.rooms.map((r, i)=>({
          id: (typeof r.id === 'string' && r.id) ? r.id : ('imported'+i+'-'+Date.now()),
          floor: (typeof r.floor === 'string' && r.floor) ? r.floor : 'Ground Floor',
          name: (typeof r.name === 'string' && r.name) ? r.name : 'Room',
          area: Number(r.area)||0,
          flooring: typeof r.flooring === 'string' ? r.flooring : '',
          price: Number(r.price)||0,
          wastage: Number.isFinite(Number(r.wastage)) ? Number(r.wastage) : 10,
          estimated: !!r.estimated,
          include: r.include !== undefined ? !!r.include : true,
          manufacturer: typeof r.manufacturer === 'string' ? r.manufacturer : '',
          productLink: typeof r.productLink === 'string' ? r.productLink : '',
        }));

        let cleanCompare = compareOptions;
        if(Array.isArray(data.compareOptions) && data.compareOptions.length){
          cleanCompare = data.compareOptions.map((c, i)=>({
            id: (typeof c.id === 'string' && c.id) ? c.id : ('opt'+i),
            name: (typeof c.name === 'string' && c.name) ? c.name : 'Flooring',
            price: Number(c.price)||0,
            cls: ['carpet','timber','tile'].includes(c.cls) ? c.cls : ['carpet','timber','tile'][i%3],
          }));
        }

        rooms = cleanRooms;
        compareOptions = cleanCompare;
        displayedCompareTotals = {};
        compareOptions.forEach(c=>displayedCompareTotals[c.id]=0);
        if(typeof data.currency === 'string' && data.currency.length <= 3) currency = data.currency;

        rooms.forEach(r=>{
          const m = /^custom(\d+)$/.exec(r.id);
          if(m) nextIdNum = Math.max(nextIdNum, parseInt(m[1],10));
        });

        scheduleSaveRooms(); scheduleSaveCompare(); scheduleSaveCurrency();
        render();
        const status = document.getElementById('save-status');
        if(status) status.textContent = 'Imported';
      }catch(err){
        alert('Couldn\u2019t read that file \u2014 it doesn\u2019t look like data exported from this calculator.');
      }
    };
    reader.readAsText(file);
  }

  function animateNumbers(targetTotal, targetCompareTotals){
    if(rafHandle) cancelAnimationFrame(rafHandle);
    const startTotal = displayedTotal, startCompare = {...displayedCompareTotals};
    const startTime = performance.now(), duration = 550;
    function tick(now){
      const t = Math.min(1, (now-startTime)/duration);
      const ease = 1 - Math.pow(1-t, 3);
      displayedTotal = startTotal + (targetTotal-startTotal)*ease;
      Object.keys(targetCompareTotals).forEach(id=>{
        const s = startCompare[id]||0;
        displayedCompareTotals[id] = s + (targetCompareTotals[id]-s)*ease;
      });
      paintNumbers();
      if(t<1) rafHandle = requestAnimationFrame(tick); else { displayedTotal = targetTotal; displayedCompareTotals = {...targetCompareTotals}; paintNumbers(); }
    }
    rafHandle = requestAnimationFrame(tick);
  }

  function paintNumbers(){
    const heroFig = document.getElementById('hero-total-fig');
    if(heroFig) heroFig.textContent = currency + fmt(displayedTotal);
    compareOptions.forEach(c=>{
      const el = document.getElementById('compare-total-'+c.id);
      if(el) el.textContent = currency + fmt(displayedCompareTotals[c.id]||0);
    });
  }

  function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function normalizeUrl(link){
    const trimmed = String(link||'').trim();
    if(!trimmed) return '';
    if(/^https?:\/\//i.test(trimmed)) return trimmed;
    return 'https://' + trimmed;
  }

  function buildRoomCardHtml(r){
    const cost = roomCost(r);
    const linkHref = r.productLink ? escapeHtml(normalizeUrl(r.productLink)) : '#';
    return `
      <div class="room-card ${r.estimated?'estimated':''}" id="room-${r.id}">
        <button class="remove-btn" data-remove="${r.id}" title="Remove room">×</button>
        <div class="room-card-header">
          <button class="include-toggle ${r.include?'on':''}" data-toggle-include="${r.id}" title="Include in comparison"></button>
          <input type="text" class="room-name-input" value="${escapeHtml(r.name)}" data-id="${r.id}" data-field="name" placeholder="Room name" />
          ${r.estimated?'<span class="est-tag">Est.</span>':''}
        </div>
        <div class="room-card-measurements">
          <div class="field"><label>Area (m²)</label><input type="number" step="0.01" min="0" value="${r.area}" data-id="${r.id}" data-field="area" /></div>
          <div class="field"><label>Flooring type</label><input type="text" value="${escapeHtml(r.flooring)}" data-id="${r.id}" data-field="flooring" placeholder="e.g. Carpet" /></div>
          <div class="field"><label>Price /m²</label><input type="number" step="0.01" min="0" value="${r.price}" data-id="${r.id}" data-field="price" /></div>
          <div class="field"><label>Wastage %</label><input type="number" step="1" min="0" value="${r.wastage}" data-id="${r.id}" data-field="wastage" /></div>
          <div class="cost-out" id="cost-${r.id}"><span class="lbl">Cost</span><span class="cur">${currency}</span>${fmt(cost)}</div>
        </div>
        <div class="room-card-product">
          <div class="field"><label>Manufacturer</label><input type="text" value="${escapeHtml(r.manufacturer||'')}" data-id="${r.id}" data-field="manufacturer" placeholder="e.g. Karndean" /></div>
          <div class="field"><label>Product link</label><input type="url" value="${escapeHtml(r.productLink||'')}" data-id="${r.id}" data-field="productLink" placeholder="https://..." /></div>
          <a class="product-link-btn ${r.productLink?'':'disabled'}" id="link-${r.id}" href="${linkHref}" target="_blank" rel="noopener noreferrer" title="${r.productLink?'Open product page':'Add a link to enable'}">🔗</a>
        </div>
      </div>`;
  }

  function computeAll(){
    const floors = ['First Floor','Ground Floor','Outbuilding'];
    let grandTotal = 0, grandArea = 0;
    const floorTotals = {};
    rooms.forEach(r=>{ const cost = roomCost(r); grandTotal += cost; grandArea += Number(r.area)||0; floorTotals[r.floor] = (floorTotals[r.floor]||0)+cost; });

    const includedRooms = rooms.filter(r=>r.include);
    const includedArea = includedRooms.reduce((s,r)=>s+(Number(r.area)||0),0);
    const compareTotals = {};
    compareOptions.forEach(c=>{ compareTotals[c.id] = includedRooms.reduce((s,r)=>s+roomCost(r, c.price),0); });
    const maxCompare = Math.max(1, ...Object.values(compareTotals));
    const positiveTotals = compareOptions.filter(c=>Number(c.price)>0).map(c=>compareTotals[c.id]);
    const minTotal = positiveTotals.length ? Math.min(...positiveTotals) : null;

    let ringOffset = 0;
    const circumference = 2*Math.PI*50;
    const ringSegs = floors.filter(f=>floorTotals[f]).map(f=>{
      const frac = grandTotal>0 ? (floorTotals[f]/grandTotal) : 0;
      const seg = { color:FLOOR_COLORS[f], frac, offset:ringOffset };
      ringOffset += frac;
      return seg;
    });

    return { floors, grandTotal, grandArea, floorTotals, includedRooms, includedArea, compareTotals, maxCompare, minTotal, ringSegs, circumference };
  }

  // Lightweight update: recompute figures and patch only the specific elements that changed.
  // Never touches <input> elements, so the field the person is typing in keeps focus and caret position.
  function recompute(){
    const { floors, grandTotal, floorTotals, includedRooms, includedArea, compareTotals, maxCompare, minTotal, ringSegs, circumference } = computeAll();

    rooms.forEach(r=>{
      const el = document.getElementById('cost-'+r.id);
      if(el) el.innerHTML = `<span class="cur">${currency}</span>${fmt(roomCost(r))}`;
      const linkBtn = document.getElementById('link-'+r.id);
      if(linkBtn){
        const has = !!r.productLink;
        linkBtn.href = has ? normalizeUrl(r.productLink) : '#';
        linkBtn.classList.toggle('disabled', !has);
        linkBtn.title = has ? 'Open product page' : 'Add a link to enable';
      }
    });
    floors.forEach(f=>{
      const el = document.getElementById('subtotal-'+f.replace(/\s/g,''));
      const floorArea = rooms.filter(r=>r.floor===f).reduce((s,r)=>s+(Number(r.area)||0),0);
      if(el) el.textContent = `${currency}${fmt(floorTotals[f]||0)} · ${floorArea.toFixed(1)} m²`;
    });

    const hint = document.getElementById('section-hint');
    if(hint) hint.textContent = `Based on the ${includedRooms.length} room${includedRooms.length===1?'':'s'} ticked below · ${includedArea.toFixed(1)} m²`;

    const breakdown = document.getElementById('hero-breakdown');
    if(breakdown){
      breakdown.innerHTML = floors.filter(f=>floorTotals[f]).map(f=>`<div class="hero-chip"><span class="dot" style="background:${FLOOR_COLORS[f]}"></span>${f}: ${currency}${fmt(floorTotals[f])}</div>`).join('')
        + `<div class="hero-chip">${rooms.reduce((s,r)=>s+(Number(r.area)||0),0).toFixed(1)} m² across ${rooms.length} rooms</div>`;
    }
    const ringSvg = document.getElementById('hero-ring-svg');
    if(ringSvg){
      ringSvg.innerHTML = `<circle cx="56" cy="56" r="50" fill="none" stroke="rgba(17,17,17,0.15)" stroke-width="8"/>`
        + ringSegs.map(s=>`<circle cx="56" cy="56" r="50" fill="none" stroke="${s.color}" stroke-width="8"
            stroke-dasharray="${(s.frac*circumference).toFixed(1)} ${circumference.toFixed(1)}"
            stroke-dashoffset="${(-s.offset*circumference).toFixed(1)}" stroke-linecap="round"/>`).join('');
    }

    compareOptions.forEach(c=>{
      const total = compareTotals[c.id];
      const isBest = minTotal!==null && Number(c.price)>0 && total===minTotal;
      const card = document.getElementById('compare-card-'+c.id);
      if(card) card.classList.toggle('is-best', !!isBest);
      const bar = document.getElementById('compare-bar-'+c.id);
      if(bar) bar.style.width = (maxCompare>0 ? Math.max(4, total/maxCompare*100) : 0)+'%';
    });

    animateNumbers(grandTotal, compareTotals);
  }

  // Full rebuild: only used on load, add/remove room, and reset (structural changes).
  function render(){
    const { floors, grandTotal, grandArea, floorTotals, includedRooms, includedArea, compareTotals, maxCompare, minTotal, ringSegs, circumference } = computeAll();

    let html = `
      <div class="print-header">
        <h1>Flooring Cost Report</h1>
        <div class="meta">Generated ${new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' })} · figures in ${currency}, estimated from floor plan measurements</div>
      </div>
      <div class="title-row stagger" style="animation-delay:.02s">
        <h1>Flooring Cost Calculator</h1>
        <span class="version-tag">v3</span>
      </div>
      <p class="subhead stagger" style="animation-delay:.06s">Pre-loaded from your floor plan measurements. Compare flooring types, or edit each room's own price directly.</p>

      <div class="toolbar stagger" style="animation-delay:.1s">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <select class="pill-select" id="currency-select">
            <option value="£" ${currency==='£'?'selected':''}>£ GBP</option>
            <option value="€" ${currency==='€'?'selected':''}>€ EUR</option>
            <option value="$" ${currency==='$'?'selected':''}>$ USD</option>
          </select>
          <button class="pill-btn" id="export-pdf-btn">Export PDF</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <button class="pill-btn" id="export-data-btn">Export data</button>
          <button class="pill-btn" id="import-data-btn">Import data</button>
          <input type="file" id="import-file-input" class="file-hidden-input" accept="application/json,.json" />
          <button class="pill-btn" id="reset-btn">Reset to plan defaults</button>
        </div>
      </div>

      <div class="hero stagger" style="animation-delay:.14s">
        <div class="orb">
          <div class="orb-ring">
            <svg viewBox="0 0 112 112" id="hero-ring-svg">
              <circle cx="56" cy="56" r="50" fill="none" stroke="rgba(17,17,17,0.15)" stroke-width="8"/>
              ${ringSegs.map(s=>`<circle cx="56" cy="56" r="50" fill="none" stroke="${s.color}" stroke-width="8"
                stroke-dasharray="${(s.frac*circumference).toFixed(1)} ${circumference.toFixed(1)}"
                stroke-dashoffset="${(-s.offset*circumference).toFixed(1)}" stroke-linecap="round"/>`).join('')}
            </svg>
            <div class="orb-figure"><div class="num" id="hero-total-fig">${currency}${fmt(0)}</div><div class="cur">total est.</div></div>
          </div>
        </div>
        <div class="hero-copy">
          <div class="hero-label">Estimated whole-house flooring cost</div>
          <div class="hero-total" style="display:none;"></div>
          <div class="hero-breakdown" id="hero-breakdown">
            ${floors.filter(f=>floorTotals[f]).map(f=>`<div class="hero-chip"><span class="dot" style="background:${FLOOR_COLORS[f]}"></span>${f}: ${currency}${fmt(floorTotals[f])}</div>`).join('')}
            <div class="hero-chip">${grandArea.toFixed(1)} m² across ${rooms.length} rooms</div>
          </div>
        </div>
      </div>

      <div class="section-title stagger" style="animation-delay:.18s">
        <h2>Compare Flooring Types</h2>
        <div class="section-hint" id="section-hint">Based on the ${includedRooms.length} room${includedRooms.length===1?'':'s'} ticked below · ${includedArea.toFixed(1)} m²</div>
      </div>
      <div class="compare-grid stagger" style="animation-delay:.2s">
        ${compareOptions.map(c=>{
          const total = compareTotals[c.id];
          const isBest = minTotal!==null && Number(c.price)>0 && total===minTotal;
          const barPct = maxCompare>0 ? Math.max(4,(total/maxCompare*100)) : 0;
          return `
          <div class="compare-card ${c.cls} ${isBest?'is-best':''}" id="compare-card-${c.id}">
            <span class="best-tag">Best value</span>
            <div>
              <input class="compare-name-input" data-compare-id="${c.id}" data-compare-field="name" value="${escapeHtml(c.name)}" placeholder="Flooring name" />
              <div class="compare-price-row">
                <span class="cur">${currency}</span>
                <input type="number" class="compare-price-input" min="0" step="0.01" data-compare-id="${c.id}" data-compare-field="price" value="${c.price}" placeholder="0.00" />
                <span class="compare-per-m2">/ m²</span>
              </div>
            </div>
            <div class="compare-total">
              <div class="t-label">Estimated total</div>
              <div class="t-figure" id="compare-total-${c.id}">${currency}${fmt(0)}</div>
              <div class="bar-track"><div class="bar-fill" id="compare-bar-${c.id}" style="width:0%"></div></div>
            </div>
          </div>`;
        }).join('')}
      </div>
    `;

    floors.forEach((floor, fi) => {
      const floorRooms = rooms.filter(r=>r.floor===floor);
      if(floorRooms.length===0) return;
      let floorTotal = 0, floorArea = 0;
      const floorIdSafe = floor.replace(/\s/g,'');
      html += `<div class="floor-block stagger" style="animation-delay:${(0.24+fi*0.05).toFixed(2)}s" data-floor="${floor}"><div class="floor-title"><h2>${floor}</h2><div class="floor-subtotal" id="subtotal-${floorIdSafe}"></div></div>`;
      floorRooms.forEach(r=>{
        const cost = roomCost(r); floorTotal+=cost; floorArea += Number(r.area)||0;
        html += buildRoomCardHtml(r);
      });
      html += `<button class="add-room-btn" data-add-floor="${floor}">+ Add room to ${floor}</button></div>`;
      html = html.replace(`id="subtotal-${floorIdSafe}"></div>`, `id="subtotal-${floorIdSafe}">${currency}${fmt(floorTotal)} · ${floorArea.toFixed(1)} m²</div>`);
    });

    html += `<p class="save-note stagger" style="animation-delay:.4s">Saved automatically · tick the box on a room to include it in the compare panel above <span id="save-status" style="font-style:normal;"></span></p>`;

    root.innerHTML = html;
    attachHandlers();
    animateNumbers(grandTotal, compareTotals);
    requestAnimationFrame(()=>{
      compareOptions.forEach(c=>{
        const bar = document.getElementById('compare-bar-'+c.id);
        if(bar) bar.style.width = (maxCompare>0 ? Math.max(4, compareTotals[c.id]/maxCompare*100) : 0)+'%';
      });
    });
  }

  function wireRoomCard(cardEl){
    cardEl.querySelectorAll('input[data-id]').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const id = e.target.getAttribute('data-id'), field = e.target.getAttribute('data-field');
        let val = e.target.value;
        if(['area','price','wastage'].includes(field)) val = parseFloat(val)||0;
        updateRoom(id, field, val);
      });
    });
    const toggleBtn = cardEl.querySelector('[data-toggle-include]');
    if(toggleBtn) toggleBtn.addEventListener('click', e=>toggleInclude(e.currentTarget.getAttribute('data-toggle-include')));
    const removeBtn = cardEl.querySelector('[data-remove]');
    if(removeBtn) removeBtn.addEventListener('click', e=>removeRoom(e.target.getAttribute('data-remove')));
  }

  function attachHandlers(){
    // 'input' fires on every keystroke — pairs with recompute() (not a full render) so typing feels live and never loses focus.
    root.querySelectorAll('.room-card').forEach(card=>wireRoomCard(card));
    root.querySelectorAll('[data-add-floor]').forEach(btn=>{
      btn.addEventListener('click', e=>addRoom(e.target.getAttribute('data-add-floor')));
    });
    root.querySelectorAll('[data-compare-id]').forEach(inp=>{
      inp.addEventListener('input', e=>{
        const id = e.target.getAttribute('data-compare-id'), field = e.target.getAttribute('data-compare-field');
        let val = e.target.value;
        if(field==='price') val = parseFloat(val)||0;
        updateCompare(id, field, val);
      });
    });
    const resetBtn = document.getElementById('reset-btn'); if(resetBtn) resetBtn.addEventListener('click', resetDefaults);
    const exportPdfBtn = document.getElementById('export-pdf-btn'); if(exportPdfBtn) exportPdfBtn.addEventListener('click', generatePDF);
    const exportDataBtn = document.getElementById('export-data-btn'); if(exportDataBtn) exportDataBtn.addEventListener('click', exportData);
    const importDataBtn = document.getElementById('import-data-btn'); if(importDataBtn) importDataBtn.addEventListener('click', triggerImport);
    const importFileInput = document.getElementById('import-file-input');
    if(importFileInput) importFileInput.addEventListener('change', (e)=>{
      const f = e.target.files && e.target.files[0];
      if(f) handleImportFile(f);
      e.target.value = '';
    });
    const curSel = document.getElementById('currency-select');
    if(curSel) curSel.addEventListener('change', e=>{
      const y = window.scrollY;
      currency = e.target.value;
      scheduleSaveCurrency();
      render();
      window.scrollTo(0, y);
    });
  }

  load();
})();
</script>
