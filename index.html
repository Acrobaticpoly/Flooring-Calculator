<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flooring &amp; Paint Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
<style>
  :root{
    color-scheme:light;
    --canvas:#F4F1EA;
    --card:#ffffff;
    --card-soft:#ffffff;
    --ink:#111111;
    --ink-mute:#57534a;
    --line:rgba(17,17,17,0.35);
    --lime:#C6F135;
    --lime-ink:#1c2400;
    --pink:#FF6FA0;
    --pink-ink:#3a0016;
    --purple:#7B5CFA;
    --paint:#FFB547;
    --paint-ink:#3a2300;
    --carpet:#FF6FA0;
    --timber:#C6F135;
    --tile:#7B5CFA;
    --border-w:2.5px;
    --radius-lg:18px;
    --radius-md:14px;
    --radius-sm:10px;
    --shadow-ink:4px 4px 0 var(--ink);
    --shadow-ink-sm:2.5px 2.5px 0 var(--ink);
  }
  html, body{ background:var(--canvas); margin:0; }
  *{ box-sizing:border-box; }

  #floorapp{
    font-family:'Plus Jakarta Sans', -apple-system, 'Segoe UI', sans-serif;
    background:
      linear-gradient(rgba(17,17,17,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(17,17,17,0.06) 1px, transparent 1px),
      var(--canvas);
    background-size:26px 26px;
    color:var(--ink);
    padding:26px 18px 110px;
    min-height:100%;
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #floorapp .wrap{ max-width:980px; margin:0 auto; }
  #floorapp *{ box-sizing:border-box; }
  #floorapp .mono, #floorapp input[type="number"]{ font-family:'JetBrains Mono', ui-monospace, Menlo, monospace; font-variant-numeric:tabular-nums; }

  #floorapp h1{
    font-size:26px; font-weight:800; letter-spacing:-0.01em; text-transform:uppercase; margin:0;
    text-shadow:3px 3px 0 var(--lime); text-wrap:balance;
  }
  #floorapp .title-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  #floorapp .version-tag{
    font-family:'JetBrains Mono', monospace; font-size:11px; font-weight:700; color:var(--ink);
    background:var(--card); border:1.5px solid var(--ink); border-radius:999px; padding:3px 10px;
  }
  #floorapp .subhead{ color:var(--ink-mute); font-size:13px; font-weight:600; margin:0 0 18px; max-width:65ch; }

  @keyframes riseIn{ from{ opacity:.35; transform:translateY(8px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    #floorapp *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  #floorapp .stagger{ animation:riseIn 0.5s cubic-bezier(.2,.8,.2,1) both; }

  /* ---------- Tabs ---------- */
  #floorapp .tabs{ display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px; }
  #floorapp .tab{
    font-family:inherit; display:flex; align-items:center; gap:10px; cursor:pointer;
    padding:10px 14px; border-radius:var(--radius-sm); border:var(--border-w) solid var(--ink);
    background:var(--card); color:var(--ink); box-shadow:var(--shadow-ink-sm);
    font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    transition:transform .1s ease, box-shadow .1s ease;
  }
  #floorapp .tab .tab-fig{ font-family:'JetBrains Mono', monospace; font-size:12px; font-weight:700; text-transform:none; letter-spacing:0; padding:2px 8px; border:1.5px solid var(--ink); border-radius:999px; background:var(--card); }
  #floorapp .tab .swatch{ width:11px; height:11px; border-radius:3px; border:1.5px solid var(--ink); }
  #floorapp .tab:hover{ transform:translate(-1px,-1px); }
  #floorapp .tab[aria-selected="true"]{ background:var(--ink); color:#fff; box-shadow:var(--shadow-ink-sm); }
  #floorapp .tab[aria-selected="true"] .tab-fig{ color:var(--ink); }
  #floorapp .tab:focus-visible, #floorapp button:focus-visible, #floorapp a:focus-visible, #floorapp select:focus-visible{ outline:2.5px solid var(--purple); outline-offset:2px; }

  /* ---------- Toolbar ---------- */
  #floorapp .toolbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; gap:10px; flex-wrap:wrap; }
  #floorapp .toolbar-group{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  #floorapp .pill-select{
    font-family:inherit; font-size:12px; font-weight:700; padding:8px 12px; border-radius:var(--radius-sm);
    border:var(--border-w) solid var(--ink); background:var(--card); color:var(--ink);
    box-shadow:var(--shadow-ink-sm); cursor:pointer;
  }
  #floorapp .pill-btn{
    font-family:inherit; font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em;
    padding:9px 15px; border-radius:var(--radius-sm);
    border:var(--border-w) solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer;
    box-shadow:var(--shadow-ink-sm);
    transition:transform .1s ease, box-shadow .1s ease;
  }
  #floorapp .pill-btn:hover{ background:var(--lime); }
  #floorapp .pill-btn:active{ transform:translate(2px,2px); box-shadow:0 0 0 var(--ink); }
  #floorapp .pill-btn.armed{ background:var(--pink); }

  /* ---------- Hero dial ---------- */
  #floorapp .hero{
    position:relative; border-radius:var(--radius-lg); overflow:visible;
    background:var(--card); border:var(--border-w) solid var(--ink); box-shadow:var(--shadow-ink);
    padding:18px 24px; margin-bottom:18px;
    display:flex; align-items:center; gap:26px; flex-wrap:wrap;
  }
  #floorapp .orb{ position:relative; width:150px; height:150px; flex-shrink:0; display:flex; align-items:center; justify-content:center; }
  #floorapp .orb::before{
    content:''; position:absolute; width:118px; height:118px; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(12deg);
    background:var(--orb-bg, var(--lime)); border:var(--border-w) solid var(--ink); border-radius:26px;
    animation:wiggle 5s ease-in-out infinite;
  }
  #floorapp .orb.paint{ --orb-bg:var(--paint); }
  #floorapp .orb.combined{ --orb-bg:var(--purple); }
  @keyframes wiggle{ 0%,100%{ transform:translate(-50%,-50%) rotate(12deg); } 50%{ transform:translate(-50%,-50%) rotate(6deg); } }
  #floorapp .orb-ring{
    position:relative; width:112px; height:112px; border-radius:50%;
    background:var(--card); border:var(--border-w) solid var(--ink);
    display:flex; align-items:center; justify-content:center; text-align:center;
    box-shadow:var(--shadow-ink-sm);
  }
  #floorapp .orb-ring svg{ position:absolute; inset:-2.5px; width:112px; height:112px; transform:rotate(-90deg); }
  #floorapp .orb-figure{ position:relative; z-index:1; }
  #floorapp .orb-figure .num{ font-family:'JetBrains Mono', monospace; font-size:17px; font-weight:700; letter-spacing:-0.02em; }
  #floorapp .orb-figure .cur{ font-size:10px; color:var(--ink-mute); font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }

  #floorapp .hero-copy{ flex:1; min-width:220px; }
  #floorapp .hero-label{ font-size:11px; text-transform:uppercase; letter-spacing:0.08em; color:var(--ink-mute); font-weight:800; margin-bottom:8px; }
  #floorapp .hero-breakdown{ display:flex; gap:8px; flex-wrap:wrap; }
  #floorapp .hero-chip{
    display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--ink); font-weight:700;
    border:1.5px solid var(--ink); border-radius:999px; padding:4px 10px 4px 8px; background:var(--card);
  }
  #floorapp .hero-chip .dot{ width:8px; height:8px; border-radius:50%; border:1.5px solid var(--ink); }

  /* ---------- Section titles ---------- */
  #floorapp .section-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; margin:6px 0 12px; }
  #floorapp .section-title h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; color:var(--ink); margin:0; }
  #floorapp .section-hint{ font-size:11.5px; color:var(--ink-mute); font-weight:600; }

  /* ---------- Compare panel ---------- */
  #floorapp .compare-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-bottom:18px; }
  #floorapp .compare-card{
    position:relative; border-radius:var(--radius-md); padding:18px 16px 16px;
    border:var(--border-w) solid var(--ink); box-shadow:var(--shadow-ink);
    overflow:visible; min-height:168px; display:flex; flex-direction:column; justify-content:space-between;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  #floorapp .compare-card:hover{ transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  #floorapp .compare-card.carpet{ background:var(--carpet); color:#111; }
  #floorapp .compare-card.timber{ background:var(--timber); color:#111; }
  #floorapp .compare-card.tile{ background:var(--tile); color:#fff; }
  #floorapp .compare-card .best-tag{
    position:absolute; top:-12px; right:14px; background:var(--lime); color:var(--lime-ink);
    border:1.5px solid var(--ink); font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:0.03em;
    padding:4px 9px; border-radius:999px; opacity:0; transform:rotate(-6deg) scale(0.7);
    transition:all .25s cubic-bezier(.2,1.4,.4,1);
  }
  #floorapp .compare-card.is-best .best-tag{ opacity:1; transform:rotate(-6deg) scale(1); }
  #floorapp .compare-name-input{
    font-family:inherit; font-weight:800; font-size:15px; text-transform:uppercase; color:inherit; background:transparent;
    border:none; border-bottom:2px dashed currentColor; padding:2px 0; width:78%; opacity:0.92;
  }
  #floorapp .compare-name-input:focus{ outline:none; border-bottom-style:solid; opacity:1; }
  #floorapp .compare-name-input::placeholder{ color:inherit; opacity:0.6; }
  #floorapp .compare-price-row{ display:flex; align-items:center; gap:6px; margin-top:10px; }
  #floorapp .compare-price-row .cur{ font-size:13px; font-weight:700; }
  #floorapp .compare-price-input{
    font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; color:var(--ink);
    background:var(--card); border:1.5px solid var(--ink); border-radius:8px; padding:5px 8px; width:80px;
  }
  #floorapp .compare-per-m2{ font-size:10.5px; font-weight:700; opacity:0.85; }
  #floorapp .compare-total{ margin-top:14px; }
  #floorapp .compare-total .t-label{ font-size:10px; text-transform:uppercase; letter-spacing:0.06em; font-weight:800; opacity:0.85; }
  #floorapp .compare-total .t-figure{ font-family:'JetBrains Mono', monospace; font-size:21px; font-weight:700; }
  #floorapp .bar-track{ height:10px; border-radius:999px; background:var(--card); border:1.5px solid var(--ink); margin-top:8px; overflow:hidden; }
  #floorapp .bar-fill{ height:100%; border-radius:999px; background:var(--ink); width:0%; transition:width .6s cubic-bezier(.2,.8,.2,1); }

  /* ---------- Room list ---------- */
  #floorapp .floor-block{ margin-bottom:24px; }
  #floorapp .floor-title{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; border-bottom:var(--border-w) solid var(--ink); padding-bottom:7px; margin-bottom:11px; }
  #floorapp .floor-title h2{ font-size:13px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; margin:0; }
  #floorapp .floor-subtotal{ font-family:'JetBrains Mono', monospace; font-size:13px; font-weight:700; text-align:right; }

  #floorapp .room-card{
    position:relative; background:var(--card-soft);
    border:1.5px solid var(--ink); border-radius:var(--radius-sm);
    padding:14px 44px 14px 14px; margin-bottom:10px;
    display:flex; flex-direction:column; gap:10px;
    box-shadow:2.5px 2.5px 0 rgba(17,17,17,0.18);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  #floorapp .room-card:hover{ transform:translate(-1.5px,-1.5px); box-shadow:4px 4px 0 var(--ink); }
  #floorapp .room-card.estimated{ border-left:5px solid var(--pink); }
  #floorapp .room-card-header{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  #floorapp .room-card-measurements{ display:grid; grid-template-columns:0.85fr 1.15fr 0.75fr 0.7fr auto; gap:10px; align-items:end; }
  #floorapp .room-card-product{ display:grid; grid-template-columns:1fr 1fr auto; gap:10px; align-items:end; border-top:1px dashed var(--line); padding-top:10px; }
  #floorapp .product-link-btn{
    display:flex; align-items:center; justify-content:center; width:36px; height:36px; flex-shrink:0;
    border:1.5px solid var(--ink); border-radius:8px; background:var(--card); color:var(--ink);
    text-decoration:none; transition:background .12s ease;
  }
  #floorapp .product-link-btn svg{ width:16px; height:16px; }
  #floorapp .product-link-btn:hover{ background:var(--lime); }
  #floorapp .product-link-btn.disabled{ opacity:0.3; pointer-events:none; }

  #floorapp .include-toggle{
    width:24px; height:24px; border-radius:7px; border:1.5px solid var(--ink); background:var(--card);
    cursor:pointer; display:flex; align-items:center; justify-content:center; align-self:center; flex-shrink:0;
    transition:all .12s ease; padding:0;
  }
  #floorapp .include-toggle.on{ background:var(--lime); }
  #floorapp .include-toggle.on::after{ content:'✓'; color:var(--ink); font-size:14px; font-weight:800; }
  #floorapp .include-toggle.paint.on{ background:var(--paint); }

  #floorapp .field{ display:flex; flex-direction:column; gap:4px; min-width:0; }
  #floorapp .field label{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-mute); font-weight:800; }
  #floorapp input[type="text"], #floorapp input[type="number"], #floorapp input[type="url"], #floorapp .field select{
    font-family:inherit; font-size:13px; padding:7px 8px; border:1.5px solid var(--ink);
    border-radius:8px; background:#fff; color:var(--ink); width:100%;
  }
  #floorapp input[type="number"]{ font-family:'JetBrains Mono', monospace; }
  #floorapp input:focus{ outline:2.5px solid var(--lime); outline-offset:1px; }
  #floorapp .room-name-input{ font-weight:700; font-size:14px; flex:1; min-width:140px; }

  #floorapp .est-tag, #floorapp .status-tag{
    font-size:9px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em;
    border:1px solid var(--ink); padding:2px 7px; border-radius:999px; white-space:nowrap; flex-shrink:0;
  }
  #floorapp .est-tag{ color:var(--pink-ink); background:var(--pink); }
  #floorapp .status-tag.specified{ background:var(--lime); color:var(--lime-ink); }
  #floorapp .status-tag.pending{ background:var(--paint); color:var(--paint-ink); }
  #floorapp .status-tag.none{ background:#ece8df; color:var(--ink-mute); }

  #floorapp .cost-out{ font-family:'JetBrains Mono', monospace; font-weight:700; font-size:15px; color:var(--ink); text-align:right; padding-bottom:7px; font-variant-numeric:tabular-nums; }
  #floorapp .cost-out .lbl{ display:block; font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-mute); font-weight:800; font-family:'Plus Jakarta Sans', sans-serif; margin-bottom:4px; }
  #floorapp .cost-out .cur{ font-size:11px; color:var(--ink-mute); font-weight:600; margin-right:2px; }

  #floorapp .remove-btn{
    position:absolute; top:10px; right:10px;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink); width:26px; height:26px;
    border-radius:8px; cursor:pointer; font-size:14px; line-height:1; font-weight:800; padding:0;
  }
  #floorapp .remove-btn:hover{ background:var(--pink); }
  #floorapp .remove-btn.armed{ background:var(--pink); }

  #floorapp .add-room-btn{
    width:100%; padding:10px; border:1.5px dashed var(--ink); background:transparent; color:var(--ink-mute);
    border-radius:var(--radius-sm); cursor:pointer; font-size:12.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.02em; font-family:inherit; margin-top:2px;
  }
  #floorapp .add-room-btn:hover{ border-style:solid; color:var(--ink); background:rgba(198,241,53,0.35); }
  #floorapp .add-room-btn.small{ width:auto; padding:7px 12px; font-size:11px; margin:0; }
  #floorapp .add-room-btn.paint:hover{ background:rgba(255,181,71,0.35); }

  #floorapp .save-note{ font-size:11px; color:var(--ink-mute); font-weight:600; margin-top:6px; font-family:'JetBrains Mono', monospace; }

  /* ---------- Header + utilities ---------- */
  #floorapp [hidden]{ display:none !important; }
  #floorapp .app-head{ display:flex; justify-content:space-between; align-items:center; gap:12px 16px; flex-wrap:wrap; margin-bottom:20px; }
  #floorapp .utilities{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #floorapp .util-btn, #floorapp .util-select{
    font-family:inherit; font-size:11.5px; font-weight:700; padding:6px 10px; border-radius:8px;
    border:1.5px solid var(--ink); background:var(--card); color:var(--ink); cursor:pointer;
  }
  #floorapp .util-btn:hover, #floorapp .util-select:hover{ background:var(--lime); }
  #floorapp .menu{ position:relative; }
  #floorapp .menu-pop{
    position:absolute; right:0; top:calc(100% + 6px); z-index:20; min-width:220px;
    background:var(--card); border:var(--border-w) solid var(--ink); border-radius:12px; box-shadow:var(--shadow-ink-sm);
    padding:6px; display:flex; flex-direction:column;
  }
  #floorapp .menu-item{ font-family:inherit; text-align:left; font-size:12.5px; font-weight:600; padding:8px 10px; border-radius:8px; border:none; background:none; color:var(--ink); cursor:pointer; }
  #floorapp .menu-item:hover{ background:#f3efe5; }
  #floorapp .menu-item.danger{ color:#a3124d; }
  #floorapp .menu-item.armed{ background:var(--pink); color:var(--ink); font-weight:800; }
  #floorapp .menu-sep{ height:1px; background:rgba(17,17,17,0.12); margin:4px 2px; }
  #floorapp .tabs{ margin-bottom:10px; }
  #floorapp .subhead{ margin:0 0 20px; }

  /* Room names read as headings; they only look like fields when you point at them */
  #floorapp input.room-name-input{
    font-weight:800; font-size:15px; letter-spacing:-0.005em; flex:1; min-width:140px;
    border-color:transparent; background:transparent; padding:5px 6px; margin-left:-6px;
  }
  #floorapp input.room-name-input:hover{ border-color:rgba(17,17,17,0.25); border-style:dashed; }
  #floorapp input.room-name-input:focus{ border-color:var(--ink); border-style:solid; background:#fff; }
  #floorapp .remove-btn.armed{ width:auto; padding:0 9px; font-size:11px; background:var(--pink); }

  /* ---------- Paint tab ---------- */
  #floorapp .assump{ background:var(--card); border:1.5px solid var(--ink); border-radius:var(--radius-md); margin-bottom:24px; }
  #floorapp .assump summary{ list-style:none; display:flex; align-items:center; gap:10px 14px; padding:10px 12px 10px 16px; cursor:pointer; flex-wrap:wrap; }
  #floorapp .assump summary::-webkit-details-marker{ display:none; }
  #floorapp .assump-label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em; font-weight:800; color:var(--ink-mute); }
  #floorapp .assump-summary{ display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #floorapp .a-pill{ font-family:'JetBrains Mono', monospace; font-size:11.5px; font-weight:500; padding:3px 8px; border-radius:999px; background:#f5f1e8; color:var(--ink-mute); white-space:nowrap; }
  #floorapp .a-pill b{ color:var(--ink); font-weight:700; }
  #floorapp .a-div{ width:1px; height:16px; background:rgba(17,17,17,0.2); margin:0 2px; }
  #floorapp .assump-edit{ margin-left:auto; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:0.04em; border:1.5px solid var(--ink); border-radius:8px; padding:4px 10px; background:var(--card); }
  #floorapp .assump summary:hover .assump-edit{ background:var(--lime); }
  #floorapp .assump[open] summary{ border-bottom:1px dashed var(--line); }
  #floorapp .assump-body{ display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr); gap:20px 36px; padding:16px 16px 18px; }
  #floorapp .assump-col h4{ font-size:11px; text-transform:uppercase; letter-spacing:0.07em; font-weight:800; margin:0 0 10px; }
  #floorapp .assump-fields{ display:flex; gap:12px; flex-wrap:wrap; }
  #floorapp .assump-fields .field{ width:150px; }
  #floorapp .hint{ font-size:11.5px; color:var(--ink-mute); font-weight:600; margin:10px 0 0; }
  #floorapp .tin-table{ border-collapse:collapse; }
  #floorapp .tin-table th{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--ink-mute); font-weight:800; text-align:left; padding:0 12px 6px 0; }
  #floorapp .tin-table td{ padding:3px 12px 3px 0; }
  #floorapp .tin-table input{ width:92px; }
  #floorapp .tin-table .r{ text-align:right; padding-right:0; }
  #floorapp .tin-table td.mono{ font-size:12.5px; color:var(--ink-mute); font-weight:600; }

  #floorapp .room-card.paint-room{ padding:14px 16px 10px; gap:6px; }
  #floorapp .paint-room-meta{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #floorapp .paint-room-total{ margin-left:auto; font-family:'JetBrains Mono', monospace; font-weight:700; font-size:16px; font-variant-numeric:tabular-nums; }
  #floorapp .paint-room-total .cur{ font-size:11px; color:var(--ink-mute); margin-right:2px; }
  #floorapp input.note-input{ font-size:12px; font-weight:600; color:var(--ink-mute); border-color:transparent; background:transparent; padding:3px 6px; margin-left:-6px; }
  #floorapp input.note-input::placeholder{ color:#a59e8f; }
  #floorapp input.note-input:hover{ border-color:rgba(17,17,17,0.2); border-style:dashed; }

  };
  const DEFAULT_PAINT_SETTINGS = {

  };
  const DEFAULT_COMBINE = { flooring:true, walls:true };

  const DEFAULT_WALL_COMPARE = [
    { id:'wpaint', name:'Paint', price:0, cls:'carpet' },

  // Older saved data may hold free-typed flooring values; map known ones onto the compare categories
  const LEGACY_FLOORING_MAP = { 'vinyl / tile':'Tile', 'vinyl/tile':'Tile', 'lvt / hard flooring':'Tile', 'lvt/hard flooring':'Tile', 'hard flooring':'Tile', 'vinyl':'Tile', 'lvt':'Tile',
    'lvt (luxury vinyl tile)':'Tile', 'sheet vinyl':'Tile', 'porcelain tile':'Tile', 'ceramic tile':'Tile', 'natural stone':'Tile',
    'wood':'Timber', 'hardwood':'Timber', 'engineered wood':'Timber', 'solid wood':'Timber', 'laminate':'Timber' };

  const FLOORS = ['First Floor','Ground Floor','Outbuilding'];
  const FLOOR_COLORS = { 'First Floor':'#FF6FA0', 'Ground Floor':'#7B5CFA', 'Outbuilding':'#C6F135' };
  const TABS = ['flooring','walls','combined','links'];

  const K = {
    wallRooms:'flooring-calc-wallrooms-v1', wallCompare:'flooring-calc-wallcompare-v1',
    rooms:'flooring-calc-rooms-v2', compare:'flooring-calc-compare-v2', currency:'flooring-calc-currency-v1',
    paint:'paint-calc-lines-v1', paintNotes:'paint-calc-notes-v1', paintSettings:'paint-calc-settings-v1', combine:'combined-calc-v1',
  };

  const root = document.getElementById('root');

  let wallRooms, wallCompare;
  let activeTab = 'flooring';
  let assumpOpen = false;
  const openLines = new Set();
  let displayedTotal = 0, displayedCompareTotals = {};
  let nextIdNum = 100, rafHandle = null;

  /* =====================================================================
     STORAGE — claude.ai db when published there, else browser storage
     ===================================================================== */
  const Store = (function(){
    let backendP = null;
    function ls(){ try{ return window.localStorage; }catch(e){ return null; } }
    async function pick(){
      if(window.claude && typeof window.claude.use === 'function'){
        try{ const db = await window.claude.use('db'); if(db) return { kind:'db', db }; }catch(e){}
      }
      if(window.storage && typeof window.storage.get === 'function') return { kind:'ws' };
      if(ls()) return { kind:'ls' };
      return { kind:'none' };
    }
    function backend(){ return backendP || (backendP = pick()); }
    async function get(key){
      const b = await backend();
      if(b.kind==='db'){ const s = await b.db.doc('calc/'+key).get(); return s.exists ? (s.data()||{}).value ?? null : null; }
      if(b.kind==='ws'){ const r = await window.storage.get(key); return r ? r.value : null; }
      if(b.kind==='ls'){ return ls().getItem(key); }
      return null;
    }
    async function set(key, value){
      const b = await backend();
      if(b.kind==='db') return b.db.doc('calc/'+key).set({ value, savedAt:Date.now() });
      if(b.kind==='ws') return window.storage.set(key, value);
      if(b.kind==='ls') return ls().setItem(key, value);
      throw new Error('no storage');
    }
    return { get, set };
  })();

  async function loadKey(key, fallback){
    try{ const v = await Store.get(key); return v ? JSON.parse(v) : fallback(); }
    catch(e){ return fallback(); }
  }

  function setStatus(html){ const el = document.getElementById('save-status'); if(el) el.innerHTML = html; }

  function makeSaver(key, getValue){
    let timer = null, retryTimer = null;
    async function attempt(n){
      try{ await Store.set(key, JSON.stringify(getValue())); setStatus('Saved'); }
      catch(e){
        const delay = Math.min(30000, 1500 * Math.pow(1.7, n));
        setStatus('Still saving… your changes are safe in this tab. <a href="#" id="retry-now-link" style="color:inherit;">Retry now</a>');
        const link = document.getElementById('retry-now-link');
        if(link) link.addEventListener('click', ev=>{ ev.preventDefault(); clearTimeout(retryTimer); attempt(0); });
        clearTimeout(retryTimer); retryTimer = setTimeout(()=>attempt(n+1), delay);
      }
    }
    return function(){
      setStatus('Saving…');
      clearTimeout(timer); clearTimeout(retryTimer);
      timer = setTimeout(()=>attempt(0), 500);
    };
  }
  const save = {
    rooms: makeSaver(K.rooms, ()=>rooms),

    currency: makeSaver(K.currency, ()=>currency),

    paintNotes: makeSaver(K.paintNotes, ()=>paintNotes),
    paintSettings: makeSaver(K.paintSettings, ()=>paintSettings),
    combine: makeSaver(K.combine, ()=>combine),
    wallRooms: makeSaver(K.wallRooms, ()=>wallRooms),
    wallCompare: makeSaver(K.wallCompare, ()=>wallCompare),
  };

  const clone = o => JSON.parse(JSON.stringify(o));

  function deriveWallRooms(){
    return rooms.map(r => ({ id:r.id, floor:r.floor, name:r.name, height:2.4, perimeter:0, area:0, wallType:'', price:0, wastage:10,
      estimated:false, include:r.include, manufacturer:'', productLink:'' }));
  }
  // Paint now lives on the Walls tab: make sure every painted room has a wall room, marked as Paint
  function attachPaintToWalls(){
    let changed = false;
    const paintName = (wallCompare.find(c=>/paint/i.test(c.name||''))||{}).name || 'Paint';
    paintLines.forEach(l=>{
      let w = wallRooms.find(x=>x.id===l.roomId);
      if(!w){
        const r = rooms.find(x=>x.id===l.roomId); if(!r) return;
        w = { id:r.id, floor:r.floor, name:r.name, height:2.4, perimeter:0, area:0, wallType:'', price:0, wastage:10, estimated:false, include:r.include, manufacturer:'', productLink:'' };
        wallRooms.push(w); changed = true;
      }
      if(!w.wallType && l.kind==='paint'){ w.wallType = paintName; changed = true; }
    });
    return changed;
  }
  function migrateLegacyFlooring(){
    let changed = false;
    rooms.forEach(r=>{ const k = String(r.flooring||'').trim().toLowerCase(); if(LEGACY_FLOORING_MAP[k] && r.flooring !== LEGACY_FLOORING_MAP[k]){ r.flooring = LEGACY_FLOORING_MAP[k]; changed = true; } });
    return changed;

  async function load(){
    rooms = await loadKey(K.rooms, ()=>clone(DEFAULT_ROOMS));
    compareOptions = await loadKey(K.compare, ()=>clone(DEFAULT_COMPARE));
    currency = await loadKey(K.currency, ()=>'£');

    paintNotes = await loadKey(K.paintNotes, ()=>clone(DEFAULT_PAINT_NOTES));

    combine = await loadKey(K.combine, ()=>clone(DEFAULT_COMBINE));
    if(combine.walls === undefined) combine.walls = true;
    if(migrateLegacyFlooring()) save.rooms();
    wallRooms = await loadKey(K.wallRooms, deriveWallRooms);

    wallCompare.forEach(c => displayedCompareTotals[c.id] = 0);
    if(attachPaintToWalls()) save.wallRooms();
    compareOptions.forEach(c => displayedCompareTotals[c.id] = 0);
    [...rooms, ...paintLines, ...wallRooms].forEach(x=>{ const m = /^(?:custom|customwall|pl)(\d+)$/.exec(x.id); if(m) nextIdNum = Math.max(nextIdNum, parseInt(m[1],10)); });

    const hash = (location.hash||'').replace('#','');

    else { try{ const t = localStorage.getItem('fpc-tab'); if(t==='paint') activeTab = 'walls'; else if(TABS.includes(t)) activeTab = t; }catch(e){} }

  /* =====================================================================
     MATHS
     ===================================================================== */
  function fmt(n){ return (Math.round((Number(n)||0)*100)/100).toLocaleString('en-GB', { minimumFractionDigits:2, maximumFractionDigits:2 }); }
  function fmt0(n){ return Math.round(Number(n)||0).toLocaleString('en-GB'); }
  function roomCost(r, priceOverride){
    const area = Number(r.area)||0, price = Number(priceOverride!==undefined?priceOverride:r.price)||0, wastage = Number(r.wastage)||0;
    return area*(1+wastage/100)*price;
  }

  // Cheapest mix of tins that covers the litres needed (ties → least leftover, then fewest tins).
  function tinPlan(litres){
    const tins = (paintSettings.tins||[])
      .map(t=>({ size:Number(t.size)||0, price:Number(t.price)||0 }))
      .filter(t=>t.size>0 && t.price>0)
      .sort((a,b)=>b.size-a.size);
    if(!(litres>0) || !tins.length) return { mix:[], cost:0, volume:0 };
    let best = null;
    function consider(counts, cost, vol){
      const n = counts.reduce((s,c)=>s+c,0);
      if(!best || cost < best.cost-0.001 || (Math.abs(cost-best.cost)<=0.001 && (vol < best.volume-0.001 || (Math.abs(vol-best.volume)<=0.001 && n < best.n))))
        best = { counts, cost, volume:vol, n };
    }
    function rec(i, remaining, counts, cost, vol){
      const t = tins[i];
      const maxN = Math.max(0, Math.ceil((remaining-1e-9)/t.size));
      if(i === tins.length-1){ consider(counts.concat(maxN), cost+maxN*t.price, vol+maxN*t.size); return; }
      for(let n=0; n<=maxN; n++) rec(i+1, remaining-n*t.size, counts.concat(n), cost+n*t.price, vol+n*t.size);
    }
    rec(0, litres, [], 0, 0);
    return { mix: tins.map((t,i)=>({ size:t.size, count:best.counts[i] })).filter(x=>x.count>0), cost:best.cost, volume:best.volume };
  }
  function lineCoats(l){ return (l.coats===null || l.coats===undefined || l.coats==='') ? (Number(paintSettings.coats)||0) : (Number(l.coats)||0); }
  function lineCalc(l){
    if(l.kind === 'other') return { litres:0, plan:{ mix:[], cost:0, volume:0 }, cost:Number(l.cost)||0 };
    const coverage = Number(paintSettings.coverage)||0;
    const litres = coverage>0 ? (Number(l.area)||0)*lineCoats(l)/coverage : 0;
    const plan = tinPlan(litres);
    return { litres, plan, cost:plan.cost };
  }
  function sizeLabel(s){ return (Number.isInteger(s) ? s : String(s)) + 'L'; }
  function mixText(mix){ return mix.map(m=>`${m.count}×${sizeLabel(m.size)}`).join(' + '); }
  function perLitre(t){ const s = Number(t.size)||0, pr = Number(t.price)||0; return (s>0&&pr>0) ? currency+fmt(pr/s) : '—'; }
  function assumpSummary(){
    const tins = paintSettings.tins.filter(t=>Number(t.size)>0&&Number(t.price)>0).map(t=>`<span class="a-pill">${sizeLabel(Number(t.size))} <b>${currency}${fmt0(t.price)}</b></span>`).join('');
    return `<span class="a-pill"><b>${paintSettings.coats}</b> coats</span><span class="a-pill"><b>${paintSettings.coverage}</b> m²/L</span><span class="a-div"></span>${tins}`;
  }
  function mixShort(mix){ return mix.length ? mix.map(m=>(m.count>1?m.count+'x':'')+m.size).join('+')+'L' : '-'; }

  function hostOf(url){ try{ return new URL(normalizeUrl(url)).hostname.replace(/^www\./,''); }catch(e){ return String(url||''); } }

  // Paint grouped by colour (a shopping list): litres and tins add up across rooms
  function paintGroups(A){
    const map = new Map();
    paintLines.forEach(l=>{
      const room = wallRooms.find(r=>r.id===l.roomId); if(!room) return;
      const name = String(l.colour||'').trim();
      const key = l.kind==='other' ? 'o:'+l.id : (name ? 'c:'+name.toLowerCase() : 'pending');
      if(!map.has(key)) map.set(key, { key, kind: l.kind==='other' ? 'other' : (name ? 'colour' : 'pending'),
        name: l.kind==='other' ? (name || l.surface || 'Item') : name, lines:[], link:'', litres:0, cost:0, tins:{}, usedIn:[] });
      const g = map.get(key);
      g.lines.push(l);
      if(!g.link && String(l.link||'').trim()) g.link = l.link.trim();
      g.usedIn.push(`${room.name}${l.surface && l.kind!=='other' ? ' ('+l.surface.toLowerCase()+')' : ''}`);
      if(!l.include) return;
      const res = A.lineResults[l.id];
      g.litres += res.litres; g.cost += res.cost;
      res.plan.mix.forEach(m=>{ g.tins[m.size] = (g.tins[m.size]||0) + m.count; });
    });
    const order = { colour:0, other:1, pending:2 };
    return [...map.values()].sort((a,b)=>order[a.kind]-order[b.kind]);
  }
  // Flooring grouped by product (type + manufacturer + link)
  function floorGroups(){
    const map = new Map();
    rooms.forEach(r=>{
      const type = String(r.flooring||'').trim(), man = String(r.manufacturer||'').trim(), link = String(r.productLink||'').trim();
      const key = [type, man, link].map(x=>x.toLowerCase()).join('|');
      if(!map.has(key)) map.set(key, { key, name: man ? `${man} ${type ? '· '+type : ''}`.trim() : (type || 'Flooring not set'), rooms:[], link, area:0, orderArea:0, cost:0 });
      const g = map.get(key); g.rooms.push(r);
      const a = Number(r.area)||0; g.area += a; g.orderArea += a*(1+(Number(r.wastage)||0)/100); g.cost += roomCost(r);
    });
    return [...map.values()];
  }
  // Wall finishes grouped by product; only rooms with a finish, maker or link chosen
  function wallGroups(){
    const map = new Map();
    wallRooms.forEach(r=>{
      const type = String(r.wallType||'').trim(), man = String(r.manufacturer||'').trim(), link = String(r.productLink||'').trim();
      if(!type && !man && !link) return;
      const key = [type, man, link].map(x=>x.toLowerCase()).join('|');
      if(!map.has(key)) map.set(key, { key, name: man ? `${man} ${type ? '· '+type : ''}`.trim() : (type || 'Finish not set'), rooms:[], link, area:0, orderArea:0, cost:0 });
      const g = map.get(key); g.rooms.push(r);
      const a = Number(r.area)||0; g.area += a; g.orderArea += a*(1+(Number(r.wastage)||0)/100); g.cost += roomCost(r);
    });
    return [...map.values()];
  }
  function linkCounts(A){
    const pg = paintGroups(A).filter(g=>g.kind!=='pending'), fg = floorGroups();
    const all = [...pg, ...fg, ...wallGroups()];
    return { total: all.length, linked: all.filter(g=>g.link).length };
  }

  function roomPaintStatus(roomId){
    const lines = paintLines.filter(l=>l.roomId===roomId);
    if(!lines.length) return { cls:'none', label:'No paint' };
    const paintOnes = lines.filter(l=>l.kind==='paint' && l.include);
    if(paintOnes.some(l=>!String(l.colour||'').trim())) return { cls:'pending', label:'Pending colour' };
    if(lines.some(l=>l.kind==='other' && l.include && !(Number(l.cost)>0))) return { cls:'pending', label:'Needs price' };
    return { cls:'specified', label:'Specified' };
  }

  function computeAll(){
    let grandTotal = 0, grandArea = 0;
    const floorTotals = {};
    rooms.forEach(r=>{ const cost = roomCost(r); grandTotal += cost; grandArea += Number(r.area)||0; floorTotals[r.floor] = (floorTotals[r.floor]||0)+cost; });

    const includedRooms = rooms.filter(r=>r.include);
    const includedArea = includedRooms.reduce((s,r)=>s+(Number(r.area)||0),0);
    const compareTotals = {};
    compareOptions.forEach(c=>{ compareTotals[c.id] = includedRooms.reduce((s,r)=>s+roomCost(r, c.price),0); });
    const maxCompare = Math.max(1, ...Object.values(compareTotals));
    const positiveTotals = compareOptions.filter(c=>Number(c.price)>0).map(c=>compareTotals[c.id]);
    const minTotal = positiveTotals.length ? Math.min(...positiveTotals) : null;

    // paint (attached to wall rooms)
    const roomIds = new Set(wallRooms.map(r=>r.id));
    const paintByRoom = {}, paintByFloor = {};
    let paintTotal = 0, litresTotal = 0, tinsTotal = 0;
    const colours = new Set(); let pendingLines = 0;
    const lineResults = {};
    paintLines.forEach(l=>{
      const res = lineCalc(l); lineResults[l.id] = res;
      if(!l.include || !roomIds.has(l.roomId)) return;
      const room = wallRooms.find(r=>r.id===l.roomId);
      paintByRoom[l.roomId] = (paintByRoom[l.roomId]||0) + res.cost;
      paintByFloor[room.floor] = (paintByFloor[room.floor]||0) + res.cost;
      paintTotal += res.cost; litresTotal += res.litres;
      tinsTotal += res.plan.mix.reduce((s,m)=>s+m.count,0);
      if(l.kind==='paint'){ const c = String(l.colour||'').trim(); if(c) colours.add(c.toLowerCase()); else pendingLines++; }
    });

    const W = computeWalls(paintByRoom);
    const combinedTotal = (combine.flooring?grandTotal:0) + (combine.walls?W.total:0);

    return { grandTotal, grandArea, floorTotals, includedRooms, includedArea, compareTotals, maxCompare, minTotal,
             paintByRoom, paintByFloor, paintTotal, litresTotal, tinsTotal, colourCount:colours.size, pendingLines, lineResults, combinedTotal, W };
  }
  // A room's walls = its per-m² finish (tiles, panelling…) + its paint surfaces costed in tins
  function isPaintFinish(r){ return /paint/i.test(String(r.wallType||'')); }
  function finishCost(r){ return (!r.wallType || isPaintFinish(r)) ? 0 : roomCost(r); }
  function computeWalls(paintByRoom){
    let total = 0, area = 0, finishTotal = 0; const floorTotals = {}, byRoom = {};
    wallRooms.forEach(r=>{
      const f = finishCost(r), p = paintByRoom[r.id]||0, c = f + p;
      finishTotal += f; total += c; area += Number(r.area)||0;
      floorTotals[r.floor] = (floorTotals[r.floor]||0)+c; byRoom[r.id] = c;
    });
    const included = wallRooms.filter(r=>r.include);
    const includedArea = included.reduce((s,r)=>s+(Number(r.area)||0),0);
    const compareTotals = {};
    wallCompare.forEach(c=>{ compareTotals[c.id] = included.reduce((s,r)=>s+roomCost(r, c.price),0); });
    const maxCompare = Math.max(1, ...Object.values(compareTotals));
    const pos = wallCompare.filter(c=>Number(c.price)>0).map(c=>compareTotals[c.id]);
    return { total, area, finishTotal, floorTotals, byRoom, included, includedArea, compareTotals, maxCompare, minTotal: pos.length ? Math.min(...pos) : null };
  }


  function ringSvgInner(totals, colors){
    const circumference = 2*Math.PI*50;
    const sum = Object.values(totals).reduce((s,v)=>s+(v||0),0);
    let offset = 0;
    const segs = Object.keys(totals).filter(k=>totals[k]>0).map(k=>{
      const frac = sum>0 ? totals[k]/sum : 0;
      const s = `<circle cx="56" cy="56" r="50" fill="none" stroke="${colors[k]}" stroke-width="8" stroke-dasharray="${(frac*circumference).toFixed(1)} ${circumference.toFixed(1)}" stroke-dashoffset="${(-offset*circumference).toFixed(1)}"/>`;
      offset += frac; return s;
    });
    return `<circle cx="56" cy="56" r="50" fill="none" stroke="rgba(17,17,17,0.15)" stroke-width="8"/>` + segs.join('');
  }

  /* =====================================================================
     MUTATIONS
     ===================================================================== */
  function updateRoom(id, field, value){
    const r = rooms.find(x=>x.id===id); if(!r) return; r[field]=value; save.rooms();
    if(field==='name') document.querySelectorAll(`input[data-id="${id}"][data-field="name"]`).forEach(inp=>{ if(inp !== document.activeElement) inp.value = value; });
    recompute();
  }
  function toggleInclude(id){
    const r = rooms.find(x=>x.id===id); if(!r) return;
    r.include = !r.include;
    const btn = document.querySelector(`[data-toggle-include="${id}"]`);
    if(btn){ btn.classList.toggle('on', r.include); btn.setAttribute('aria-pressed', r.include); }
    save.rooms(); recompute();
  }
  function updateCompare(id, field, value){
    const c = compareOptions.find(x=>x.id===id); if(!c) return;
    if(field==='name'){ renameMaterial(rooms, 'flooring', c.name, value, 'data-ftype', compareOptions.map(x=>x.id===id?{...x,name:value}:x), 'Choose flooring type…'); save.rooms(); }
    c[field]=value; save.compare(); recompute();
  }
  function updateWallCompare(id, field, value){
    const c = wallCompare.find(x=>x.id===id); if(!c) return;
    if(field==='name'){ renameMaterial(wallRooms, 'wallType', c.name, value, 'data-wtype', wallCompare.map(x=>x.id===id?{...x,name:value}:x), 'Choose wall finish…'); save.wallRooms(); }
    c[field]=value; save.wallCompare(); recompute();
  }
  function updateWallRoom(id, field, value){
    const r = wallRooms.find(x=>x.id===id); if(!r) return; r[field] = value;
    // Height × perimeter fills the area; the area stays editable (e.g. to take off doors and windows)
    if(field==='height' || field==='perimeter'){
      r.area = Math.round((Number(r.height)||0)*(Number(r.perimeter)||0)*100)/100;
      const inp = document.getElementById('warea-'+id); if(inp) inp.value = r.area;
    }
    if(field==='name') document.querySelectorAll(`input[data-wid="${id}"][data-wfield="name"]`).forEach(inp=>{ if(inp!==document.activeElement) inp.value = value; });
    save.wallRooms(); recompute();
  }
  function toggleWallInclude(id){
    const r = wallRooms.find(x=>x.id===id); if(!r) return; r.include = !r.include;
    const b = document.querySelector(`[data-wtoggle="${id}"]`); if(b){ b.classList.toggle('on', r.include); b.setAttribute('aria-pressed', r.include); }
    save.wallRooms(); recompute();
  }
  function removeWallRoom(id, btn){
    const linked = paintLines.filter(l=>l.roomId===id).length;
    if(!armButton(btn, linked ? `Remove + ${linked} paint line${linked===1?'':'s'}?` : 'Remove?')) return;
    wallRooms = wallRooms.filter(x=>x.id!==id);
    if(linked){ paintLines = paintLines.filter(l=>l.roomId!==id); save.paint(); }
    save.wallRooms(); rerender();
  }
  function addWallRoom(floor){
    nextIdNum++;
    const r = { id:'customwall'+nextIdNum, floor, name:'New room', height:2.4, perimeter:0, area:0, wallType:'', price:0, wastage:10, estimated:false, include:true, manufacturer:'', productLink:'' };
    wallRooms.push(r); save.wallRooms(); rerender();
    const el = document.getElementById('wroom-'+r.id);
    if(el){ el.scrollIntoView({ block:'nearest', behavior:'smooth' }); const inp = el.querySelector('.room-name-input'); if(inp){ inp.focus(); inp.select(); } }
  }

  function armButton(btn, confirmLabel){
    if(btn.dataset.armed === '1') return true;
    document.querySelectorAll('[data-armed="1"]').forEach(disarm);

  // ---- Minimal, dependency-free PDF writer (base-14 fonts, no embedding) ----
  const WINANSI_MAP = { '€':0x80, '‘':0x91, '’':0x92, '“':0x93, '”':0x94, '–':0x96, '—':0x97, '•':0x95 };
  function toWinAnsiBinaryString(str){
    let out = '';
    for(const ch of String(str)){
      const code = ch.codePointAt(0);
      let byte;
      if(code < 0x80) byte = code;
      else if(WINANSI_MAP[ch] !== undefined) byte = WINANSI_MAP[ch];
      else if(code >= 0xA0 && code <= 0xFF) byte = code;
      else byte = 0x3F;
      out += String.fromCharCode(byte);
    }
    return out;
  }
  function pdfEscapeBinary(s){ return s.replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }

  function createMiniPdf(){
    const pageWidth = 595.28, pageHeight = 841.89, marginBottom = 40;
    let pages = [], curOps = [], curAnnots = [], y = 50;
    let font = 'reg', size = 10, colorOp = '0.09 0.08 0.06 rg';
    function newPage(){ pages.push({ ops:curOps, annots:curAnnots }); curOps = []; curAnnots = []; y = 50; }
    // Clickable area over text already drawn on the current line (y = baseline, top-down)
    function link(x, w, url){
      const u = String(url||'').trim(); if(!u) return;
      const yb = pageHeight - y;
      curAnnots.push({ rect:[x, yb-3, x+w, yb+size], url:u });
    }
    function underline(x1, x2, rgb){
      const yb = (pageHeight - y - 1.6).toFixed(2);
      curOps.push(`${(rgb[0]/255).toFixed(3)} ${(rgb[1]/255).toFixed(3)} ${(rgb[2]/255).toFixed(3)} RG 0.5 w ${x1.toFixed(2)} ${yb} m ${x2.toFixed(2)} ${yb} l S`);
    }
    function ensureSpace(extra){ if(y + extra > pageHeight - marginBottom){ newPage(); return true; } return false; }
    let footerFn = null;
    function setFooter(fn){ footerFn = fn; }
    const rgbOp = (c, op) => `${(c[0]/255).toFixed(3)} ${(c[1]/255).toFixed(3)} ${(c[2]/255).toFixed(3)} ${op}`;
    function rawText(str, x, yTop, fontKey, sz, c){ return `BT /${fontKey} ${sz} Tf ${rgbOp(c,'rg')} ${x.toFixed(2)} ${(pageHeight-yTop).toFixed(2)} Td (${pdfEscapeBinary(toWinAnsiBinaryString(str))}) Tj ET`; }
    // Filled box; yTop is the box's top edge (top-down)
    function rect(x, yTop, w, h, c){ curOps.push(`${rgbOp(c,'rg')} ${x.toFixed(2)} ${(pageHeight-yTop-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`); }
    function rule(x1, x2, c, w, customY){ const yy = (pageHeight-(customY!==undefined?customY:y)).toFixed(2); curOps.push(`${rgbOp(c,'RG')} ${w} w ${x1.toFixed(2)} ${yy} m ${x2.toFixed(2)} ${yy} l S`); }
    function setFont(k){ font = k; }
    function setSize(pt){ size = pt; }
    function setColor(r,g,b){ colorOp = `${(r/255).toFixed(3)} ${(g/255).toFixed(3)} ${(b/255).toFixed(3)} rg`; }
    // Courier is fixed at 0.6em; Helvetica uses per-character estimates close to its real metrics
    const NARROW = "iljtfrI.,:;'|!() ", WIDE = 'mwMW@%';
    function widthOf(str){
      str = String(str);
      if(font==='mono'||font==='monoBold') return str.length * size * 0.6;
      let w = 0;
      for(const ch of str){
        if(ch===' ') w += 0.278; else if(NARROW.includes(ch)) w += 0.3; else if(WIDE.includes(ch)) w += 0.85;
        else if(/[A-Z]/.test(ch)) w += 0.68; else if(/[0-9£$€]/.test(ch)) w += 0.556; else w += 0.53;
      }
      return w * size * (font==='bold' ? 1.06 : 1);
    }
    function fitText(str, maxW){ str = String(str); if(widthOf(str) <= maxW) return str; let t = str; while(t.length>1 && widthOf(t+'...')>maxW) t = t.slice(0,-1); return t+'...'; }
    function text(str, x, customY){
      const fontKey = { reg:'F1', bold:'F2', mono:'F3', monoBold:'F4' }[font] || 'F1';
      const yy = customY !== undefined ? customY : y;
      curOps.push(`BT /${fontKey} ${size} Tf ${colorOp} ${x.toFixed(2)} ${(pageHeight-yy).toFixed(2)} Td (${pdfEscapeBinary(toWinAnsiBinaryString(str))}) Tj ET`);
    }
    function hline(x1, x2, customY){ const yy = customY !== undefined ? customY : y; curOps.push(`0.78 0.78 0.78 RG 0.75 w ${x1.toFixed(2)} ${(pageHeight-yy).toFixed(2)} m ${x2.toFixed(2)} ${(pageHeight-yy).toFixed(2)} l S`); }
    function advance(dy){ y += dy; }
    function build(){
      newPage();
      if(footerFn) pages.forEach((pg, i)=>{ pg.ops.push(...footerFn(i+1, pages.length, rawText)); });
      let out = '%PDF-1.4\n%âãÏÓ\n';
      const offsets = [0];
      const catalogNum=1, pagesNum=2, fReg=3, fBold=4, fMono=5, fMonoBold=6;
      let nextNum = 7; const pageNums=[], contentNums=[];
      const annotNums = [];
      pages.forEach(pg=>{ contentNums.push(nextNum++); pageNums.push(nextNum++); annotNums.push(pg.annots.map(()=>nextNum++)); });
      function writeObj(num, body){ offsets[num] = out.length; out += `${num} 0 obj\n${body}\nendobj\n`; }
      writeObj(catalogNum, `<< /Type /Catalog /Pages ${pagesNum} 0 R >>`);
      writeObj(pagesNum, `<< /Type /Pages /Kids [${pageNums.map(n=>n+' 0 R').join(' ')}] /Count ${pageNums.length} >>`);
      writeObj(fReg, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>`);
      writeObj(fBold, `<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>`);
      writeObj(fMono, `<< /Type /Font /Subtype /Type1 /BaseFont /Courier /Encoding /WinAnsiEncoding >>`);
      writeObj(fMonoBold, `<< /Type /Font /Subtype /Type1 /BaseFont /Courier-Bold /Encoding /WinAnsiEncoding >>`);
      pages.forEach((pg, i)=>{
        const stream = pg.ops.join('\n');
        writeObj(contentNums[i], `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
        const annots = annotNums[i].length ? ` /Annots [${annotNums[i].map(n=>n+' 0 R').join(' ')}]` : '';
        writeObj(pageNums[i], `<< /Type /Page /Parent ${pagesNum} 0 R /MediaBox [0 0 ${pageWidth} ${pageHeight}] /Resources << /Font << /F1 ${fReg} 0 R /F2 ${fBold} 0 R /F3 ${fMono} 0 R /F4 ${fMonoBold} 0 R >> >> /Contents ${contentNums[i]} 0 R${annots} >>`);
        pg.annots.forEach((a, j)=>{
          writeObj(annotNums[i][j], `<< /Type /Annot /Subtype /Link /Rect [${a.rect.map(v=>v.toFixed(2)).join(' ')}] /Border [0 0 0] /A << /S /URI /URI (${pdfEscapeBinary(toWinAnsiBinaryString(a.url))}) >> >>`);
        });
      });
      const xrefStart = out.length, total = nextNum;
      out += `xref\n0 ${total}\n0000000000 65535 f \n`;
      for(let n=1; n<total; n++) out += `${String(offsets[n]).padStart(10,'0')} 00000 n \n`;
      out += `trailer\n<< /Size ${total} /Root ${catalogNum} 0 R >>\nstartxref\n${xrefStart}\n%%EOF`;
      const bytes = new Uint8Array(out.length);
      for(let i=0;i<out.length;i++) bytes[i] = out.charCodeAt(i) & 0xFF;
      return bytes;
    }
    return { get y(){ return y; }, set y(v){ y = v; }, pageWidth, pageHeight, ensureSpace, setFont, setSize, setColor, widthOf, fitText, text, hline, advance, build, link, underline, rect, rule, setFooter, get font(){ return font; }, get size(){ return size; } };
  }

  function generatePDF(){
    const doc = createMiniPdf();
    const A = computeAll(), C = currency;
    const MX = 44, W = doc.pageWidth - MX*2, RIGHT = MX + W;
    const INK = [26,24,20], MUTE = [112,106,95], FAINT = [168,161,148], HAIR = [226,221,210], BAND = [245,242,235];
    const LINKC = [33,72,196], OCHRE = [154,101,17], GREEN = [47,105,64];
    const dash = '–';
    const money2 = n => (Number(n)||0) ? `${C}${fmt(n)}` : dash;
    const dateStr = new Date().toLocaleDateString('en-GB', { day:'numeric', month:'long', year:'numeric' });

    // --- type helpers (y is the text baseline) ---
    function txt(str, x, font, size, color){ doc.setFont(font); doc.setSize(size); doc.setColor(...color); doc.text(str, x); }
    function txtRight(str, xr, font, size, color){ doc.setFont(font); doc.setSize(size); const w = doc.widthOf(str); txt(str, xr - w, font, size, color); }
    function linkText(str, x, font, size, url){

    }

      const words = String(str).split(' '); const lines = []; let cur = '';

      if(cur) lines.push(cur);
      return lines;
    }

    // Section heading: label, then a rule, with room for the next line's cap height
    function section(title, sub){
      doc.ensureSpace(70);
      doc.advance(14);
      txt(title.toUpperCase(), MX, 'bold', 10.5, INK);
      if(sub) txtRight(sub, RIGHT, 'reg', 8.5, MUTE);
      doc.advance(7); doc.rule(MX, RIGHT, INK, 1.2); doc.advance(18);
    }
    function subheading(title, right){
      doc.ensureSpace(90);
      doc.advance(6);

    }

    // Generic table. cols: [{label, w, align:'l'|'r', font}] ; rows: [{cells, style, links:{i:url}, colors:{i:rgb}, wrapCol}]
    function table(cols, rows){
      const xs = []; let x = MX; cols.forEach(c=>{ xs.push(x); x += c.w; });
      const cellX = (i) => cols[i].align==='r' ? xs[i] + cols[i].w - 6 : xs[i];
      function header(){
        cols.forEach((c,i)=>{ const L = c.label.toUpperCase(); if(c.align==='r') txtRight(L, cellX(i), 'bold', 7, MUTE); else txt(L, cellX(i), 'bold', 7, MUTE); });

        const style = r.style || 'row';
        let lines = [[]];

        if(r.wrapCol !== undefined){ wrapped[r.wrapCol] = wrap(r.cells[r.wrapCol], cols[r.wrapCol].w - 10, 'reg', 8.5); }
        const nLines = Math.max(1, ...Object.values(wrapped).map(l=>l.length));
        const h = 16 + (nLines-1)*11;
        if(doc.ensureSpace(h + 4)){ header(); }
        if(style==='band'){ doc.rect(MX, doc.y - 11, W, 16, BAND); }
        if(style==='total'){ doc.rule(MX, RIGHT, INK, 0.8, doc.y - 11); }
        r.cells.forEach((c,i)=>{

            wrapped[i].forEach((ln, k)=>{ doc.y = y0 + k*11; txt(ln, cellX(i), 'reg', 8.5, (r.colors && r.colors[i]) || MUTE); });

            const colour = String(l.colour||'').trim();

              links: (l.link && colour) ? {2:l.link} : {}, colors: Object.assign({}, colour?{}:{2:OCHRE}, grey?{0:grey,1:grey,6:grey}:{}) });
          }
        });
      });
      table([{label:'Room', w:92}, {label:'Surface', w:108}, {label:'Colour', w:92}, {label:'m²', w:36, align:'r'}, {label:'Coats', w:36, align:'r'}, {label:'Tins', w:W-92-108-92-36-36-66}, {label:'Cost', w:66, align:'r'}], rows);
    });
    if(paintLines.some(l=>!l.include)){ doc.ensureSpace(14); txt('* Not counted in the totals', MX, 'reg', 8, MUTE); doc.advance(14); }

    // ===== Flooring detail =====
    section('Flooring detail', 'Cost = m² × (1 + waste) × price');
    FLOORS.forEach(floor=>{
      const fr = rooms.filter(r=>r.floor===floor); if(!fr.length) return;
      subheading(floor, `${C}${fmt(A.floorTotals[floor]||0)}`);
      table([{label:'Room', w:120}, {label:'Product', w:W-120-44-64-44-76}, {label:'m²', w:44, align:'r'}, {label:'Price/m²', w:64, align:'r'}, {label:'Waste', w:44, align:'r'}, {label:'Cost', w:76, align:'r'}],
        fr.map(r=>{
          const prod = [r.manufacturer, r.flooring].filter(x=>String(x||'').trim()).join(' · ') || dash;
          const cost = roomCost(r);
          return { cells:[r.name+(r.estimated?' (est.)':''), prod, Number(r.area||0).toFixed(2), money2(r.price), `${r.wastage}%`, money2(cost)],
            links: r.productLink ? {1:r.productLink} : {}, colors:{ 3: Number(r.price)?INK:FAINT, 5: cost?INK:FAINT } };
        }));
    });

    // ===== Walls detail (once any wall area or price is entered) =====
    const finishRooms = wallRooms.filter(r=>r.wallType && !isPaintFinish(r));
    if(finishRooms.length){
      section('Walls — tiles, panelling and other finishes', 'Area = height × perimeter, adjusted for openings');
      FLOORS.forEach(floor=>{
        const fr = finishRooms.filter(r=>r.floor===floor); if(!fr.length) return;
        subheading(floor, `${C}${fmt(fr.reduce((s,r)=>s+finishCost(r),0))}`);
        table([{label:'Room', w:110}, {label:'Finish', w:W-110-40-50-44-60-40-70}, {label:'Height', w:40, align:'r'}, {label:'Perim.', w:50, align:'r'}, {label:'m²', w:44, align:'r'}, {label:'Price/m²', w:60, align:'r'}, {label:'Waste', w:40, align:'r'}, {label:'Cost', w:70, align:'r'}],
          fr.map(r=>{
            const prod = [r.manufacturer, r.wallType].filter(x=>String(x||'').trim()).join(' · ') || dash;
            const cost = roomCost(r);
            return { cells:[r.name, prod, Number(r.height||0).toFixed(2), Number(r.perimeter||0).toFixed(2), Number(r.area||0).toFixed(1), money2(r.price), `${r.wastage}%`, money2(cost)],
              links: r.productLink ? {1:r.productLink} : {}, colors:{ 5: Number(r.price)?INK:FAINT, 7: cost?INK:FAINT } };
          }));
      });
    }

    // ===== Compare (only once prices are entered) =====
    if(compareOptions.some(c=>Number(c.price)>0)){
      section('Flooring options compared', `${A.includedRooms.length} rooms · ${A.includedArea.toFixed(1)} m²`);
      table([{label:'Option', w:W-200}, {label:'Price/m²', w:100, align:'r'}, {label:'Estimated total', w:100, align:'r'}],
        compareOptions.map(c=>{
          const isBest = A.minTotal!==null && Number(c.price)>0 && A.compareTotals[c.id]===A.minTotal;
          return { cells:[(c.name||'Option')+(isBest?'  – best value':''), money2(c.price), money2(A.compareTotals[c.id])], colors: isBest?{0:GREEN,2:GREEN}:{} };
        }));
    }

    if(wallCompare.some(c=>Number(c.price)>0)){
      section('Wall finishes compared', `${A.W.included.length} rooms · ${A.W.includedArea.toFixed(1)} m²`);
      table([{label:'Option', w:W-200}, {label:'Price/m²', w:100, align:'r'}, {label:'Estimated total', w:100, align:'r'}],
        wallCompare.map(c=>{
          const isBest = A.W.minTotal!==null && Number(c.price)>0 && A.W.compareTotals[c.id]===A.W.minTotal;
          return { cells:[(c.name||'Option')+(isBest?'  – best value':''), money2(c.price), money2(A.W.compareTotals[c.id])], colors: isBest?{0:GREEN,2:GREEN}:{} };
        }));
    }

    // ===== Notes =====
    const notes = rooms.filter(r=>paintNotes[r.id]);
    section('Notes and assumptions');
    const noteLines = [
      ...notes.map(r=>[r.name, paintNotes[r.id]]),
      ['Paint', `${paintSettings.coats} coats at ${paintSettings.coverage} m² per litre per coat. Tins: ${paintSettings.tins.filter(t=>t.size>0&&t.price>0).map(t=>`${sizeLabel(Number(t.size))} ${C}${fmt0(t.price)}`).join(', ')}. The cheapest tin mix is used for each surface.`],
      ['Areas', 'Paint areas approximate each room as a square with 2.4 m ceilings. Check wall measurements before ordering.'],
    ];
    noteLines.forEach(([k, v])=>{
      const lines = wrap(v, W-130, 'reg', 8.8);
      doc.ensureSpace(lines.length*12 + 6);
      txt(k, MX, 'bold', 8.8, INK);
      const y0 = doc.y; lines.forEach((ln, i)=>{ doc.y = y0 + i*12; txt(ln, MX+130, 'reg', 8.8, MUTE); });
      doc.y = y0 + lines.length*12 + 5;
    });

    deliverFile('Flooring_and_Paint_Report.pdf', doc.build(), 'application/pdf');
  }

  function exportData(){
    const payload = { version:5, exportedAt:new Date().toISOString(), currency, rooms, compareOptions, wallRooms, wallCompareOptions:wallCompare, paintLines, paintNotes, paintSettings, combine };
    deliverFile('Flooring_and_Paint_Data.json', JSON.stringify(payload, null, 2), 'application/json');
  }

  function handleImportFile(file){
    const reader = new FileReader();
    reader.onload = (e)=>{
      try{
        const data = JSON.parse(e.target.result);
        if(!data || !Array.isArray(data.rooms) || !data.rooms.length) throw new Error('missing rooms');
        rooms = data.rooms.map((r,i)=>({
          id:(typeof r.id==='string'&&r.id)?r.id:('imported'+i+'-'+Date.now()),
          floor:FLOORS.includes(r.floor)?r.floor:'Ground Floor',
          name:(typeof r.name==='string'&&r.name)?r.name:'Room',
          area:Number(r.area)||0, flooring:typeof r.flooring==='string'?r.flooring:'', price:Number(r.price)||0,
          wastage:Number.isFinite(Number(r.wastage))?Number(r.wastage):10, estimated:!!r.estimated,
          include:r.include!==undefined?!!r.include:true,
          manufacturer:typeof r.manufacturer==='string'?r.manufacturer:'', productLink:typeof r.productLink==='string'?r.productLink:'',
        }));
        if(Array.isArray(data.compareOptions) && data.compareOptions.length){
          compareOptions = data.compareOptions.map((c,i)=>({ id:(typeof c.id==='string'&&c.id)?c.id:('opt'+i), name:(typeof c.name==='string'&&c.name)?c.name:'Flooring', price:Number(c.price)||0, cls:['carpet','timber','tile'].includes(c.cls)?c.cls:['carpet','timber','tile'][i%3] }));
        }
        if(Array.isArray(data.paintLines)){
          paintLines = data.paintLines.map((l,i)=>({
            id:(typeof l.id==='string'&&l.id)?l.id:('pl-imp'+i), roomId:String(l.roomId||''), kind:l.kind==='other'?'other':'paint',
            surface:typeof l.surface==='string'?l.surface:'', colour:typeof l.colour==='string'?l.colour:'', link:typeof l.link==='string'?l.link:'',
            area:Number(l.area)||0, coats:(l.coats===null||l.coats===undefined||l.coats==='')?null:Number(l.coats)||0,
            cost:Number(l.cost)||0, include:l.include!==undefined?!!l.include:true, estimated:!!l.estimated,
          }));
        }
        if(data.paintNotes && typeof data.paintNotes==='object') paintNotes = { ...data.paintNotes };
        if(data.paintSettings && Array.isArray(data.paintSettings.tins)) paintSettings = {
          coverage:Number(data.paintSettings.coverage)||10, coats:Number(data.paintSettings.coats)||2,
          tins:data.paintSettings.tins.slice(0,4).map(t=>({ size:Number(t.size)||0, price:Number(t.price)||0 })),
        };
        if(data.combine && typeof data.combine==='object') combine = { flooring:data.combine.flooring!==false, walls:data.combine.walls!==false };
        if(Array.isArray(data.wallRooms)){
          wallRooms = data.wallRooms.map((r,i)=>({
            id:(typeof r.id==='string'&&r.id)?r.id:('wimported'+i+'-'+Date.now()), floor:FLOORS.includes(r.floor)?r.floor:'Ground Floor',
            name:(typeof r.name==='string'&&r.name)?r.name:'Room', height:Number(r.height)||0, perimeter:Number(r.perimeter)||0, area:Number(r.area)||0,
            wallType:typeof r.wallType==='string'?r.wallType:'', price:Number(r.price)||0, wastage:Number.isFinite(Number(r.wastage))?Number(r.wastage):10,
            estimated:!!r.estimated, include:r.include!==undefined?!!r.include:true,
            manufacturer:typeof r.manufacturer==='string'?r.manufacturer:'', productLink:typeof r.productLink==='string'?r.productLink:'',
          }));
        }
        if(Array.isArray(data.wallCompareOptions) && data.wallCompareOptions.length){
          wallCompare = data.wallCompareOptions.map((c,i)=>({ id:(typeof c.id==='string'&&c.id)?c.id:('wopt'+i), name:(typeof c.name==='string'&&c.name)?c.name:'Finish', price:Number(c.price)||0, cls:['carpet','timber','tile'].includes(c.cls)?c.cls:['carpet','timber','tile'][i%3] }));
        }
        migrateLegacyFlooring(); attachPaintToWalls();
        if(typeof data.currency==='string' && data.currency.length<=3) currency = data.currency;
        displayedCompareTotals = {}; [...compareOptions, ...wallCompare].forEach(c=>displayedCompareTotals[c.id]=0);
        [...rooms, ...paintLines].forEach(x=>{ const m = /^(?:custom|pl)(\d+)$/.exec(x.id); if(m) nextIdNum = Math.max(nextIdNum, parseInt(m[1],10)); });
        Object.values(save).forEach(fn=>fn());
        render();
        setStatus(Array.isArray(data.paintLines) ? 'Imported flooring and paint data' : 'Imported flooring data (older file — paint plan kept as it was)');
      }catch(err){
        setStatus('That file couldn’t be read. Choose a .json file exported from this calculator.');
      }
    };
    reader.readAsText(file);
  }

  /* =====================================================================
     RENDERING
     ===================================================================== */
  function escapeHtml(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function normalizeUrl(link){ const t = String(link||'').trim(); if(!t) return ''; return /^https?:\/\//i.test(t) ? t : 'https://'+t; }
  const LINK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2"/><path d="M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>';
  function linkBtn(id, link){
    const has = !!String(link||'').trim();
    return `<a class="product-link-btn ${has?'':'disabled'}" id="${id}" href="${has?escapeHtml(normalizeUrl(link)):'#'}" target="_blank" rel="noopener noreferrer" title="${has?'Open product page':'Add a link to enable'}" aria-label="Open product page">${LINK_ICON}</a>`;
  }
  function money(n){ return `<span class="cur">${currency}</span>${fmt(n)}`; }

  // Material dropdowns list the compare-card names, tinted to match their card (as in v4)
  function tintClass(value, options){
    const v = String(value||'').trim().toLowerCase(); if(!v) return '';
    const m = options.find(c => String(c.name||'').trim().toLowerCase() === v);
    return m ? 'tint-' + m.cls : '';
  }
  function materialOptionsHtml(value, options, placeholder){
    const v = String(value||'').trim().toLowerCase();
    const matched = options.some(c => String(c.name||'').trim().toLowerCase() === v);
    let html = `<option value="" ${!value?'selected':''}>${placeholder}</option>`;
    html += options.map(c=>{ const label = c.name || 'Material'; return `<option value="${escapeHtml(label)}" ${value && label.trim().toLowerCase()===v ? 'selected':''}>${escapeHtml(label)}</option>`; }).join('');
    if(value && !matched) html += `<option value="${escapeHtml(value)}" selected>${escapeHtml(value)}</option>`;
    return html;
  }
  function flooringTypeField(r){
    return `<div class="field"><label for="rfl-${r.id}">Flooring type</label>
      <select id="rfl-${r.id}" class="type-select ${tintClass(r.flooring, compareOptions)}" data-ftype="${r.id}">${materialOptionsHtml(r.flooring, compareOptions, 'Choose flooring type…')}</select></div>`;
  }
  // Renaming a compare card carries the rooms that used the old name with it
  function renameMaterial(list, field, oldName, newName, selAttr, options, placeholder){
    const o = String(oldName||'').trim().toLowerCase();
    if(o) list.forEach(r=>{ if(String(r[field]||'').trim().toLowerCase() === o) r[field] = newName; });
    document.querySelectorAll(`select[${selAttr}]`).forEach(sel=>{
      const r = list.find(x=>x.id === sel.getAttribute(selAttr)); if(!r) return;
      sel.innerHTML = materialOptionsHtml(r[field], options, placeholder);
      sel.className = 'type-select ' + tintClass(r[field], options);
    });
  }

        <button class="remove-btn" data-remove="${r.id}" title="Remove room" aria-label="Remove ${escapeHtml(r.name)}">×</button>

  function tinOutHtml(l, res){
    if(l.kind==='other') return '<span class="muted-cell">Fixed cost</span>';
    if(!res.plan.mix.length) return '<span class="muted-cell">—</span>';
    const chips = res.plan.mix.map(m=>`<span class="tin-chip">${m.count}×${sizeLabel(m.size)}</span>`).join('');
    return `<span class="tin-chips" title="${res.litres.toFixed(2)} L needed · ${fmt(res.plan.volume)} L bought">${chips}</span><span class="tin-litres">${res.litres.toFixed(1)} of ${fmt(res.plan.volume).replace(/\.00$/,'')} L</span>`;
  }

    const has = !!String(l.link||'').trim();

    return `<button class="mini-link add" data-plinkadd="${l.id}" title="Add a product link" aria-label="Add a product link">+ link</button>`;
