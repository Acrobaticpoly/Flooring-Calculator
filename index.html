          <div class="lk-cell lk-namecell">${nameCell(g.name, g.link, g.rooms.some(r=>r.manufacturer) ? '' : 'No manufacturer yet')}</div>
          <div class="lk-cell lk-used">${g.rooms.map(r=>escapeHtml(r.name)).join(' · ')}</div>
          <div class="lk-cell lk-amt"><span class="mono">${g.orderArea.toFixed(1)} m²</span><span class="tin-litres">${g.area.toFixed(1)} m² + wastage</span></div>
          <div class="lk-cell lk-cost mono">${money(g.cost)}</div>
          <div class="lk-cell lk-link">${g.link ? openBtn(g.link, g.name) : addInput('f:'+i, g.name)}</div>
        </div>`;
    });
    html += `</div>`;
    if(WG.length){
      html += `
      <div class="section-title" style="margin-top:22px"><h2>Wall finishes</h2><div class="section-hint">Grouped by product · area includes wastage</div></div>
      <div class="lk-list">
        <div class="lk-head" aria-hidden="true"><span>Product</span><span>Rooms</span><span>To order</span><span class="r">Cost</span><span class="r">Link</span></div>`;
      WG.forEach((g,i)=>{
        html += `
        <div class="lk-row">
          <div class="lk-cell lk-namecell">${nameCell(g.name, g.link, g.rooms.some(r=>r.manufacturer) ? '' : 'No manufacturer yet')}</div>
          <div class="lk-cell lk-used">${g.rooms.map(r=>escapeHtml(r.name)).join(' · ')}</div>
          <div class="lk-cell lk-amt"><span class="mono">${g.orderArea.toFixed(1)} m²</span><span class="tin-litres">${g.area.toFixed(1)} m² + wastage</span></div>
          <div class="lk-cell lk-cost mono">${money(g.cost)}</div>
          <div class="lk-cell lk-link">${g.link ? openBtn(g.link, g.name) : addInput('w:'+i, g.name)}</div>
        </div>`;
      });
      html += `</div>`;
    }
    html += `
      <p class="save-note">Links you paste here are saved to every room in that group · <span id="save-status"></span></p>`;
    return html;
  }

  async function copyAllLinks(){
    const A = computeAll();
    const lines = ['PAINT'];
    paintGroups(A).filter(g=>g.kind!=='pending').forEach(g=>lines.push(`${g.name} (${g.usedIn.join(', ')}): ${g.link ? normalizeUrl(g.link) : 'no link yet'}`));
    lines.push('', 'FLOORING');
    floorGroups().forEach(g=>lines.push(`${g.name} (${g.rooms.map(r=>r.name).join(', ')}): ${g.link ? normalizeUrl(g.link) : 'no link yet'}`));
    const wg = wallGroups();
    if(wg.length){ lines.push('', 'WALL FINISHES'); wg.forEach(g=>lines.push(`${g.name} (${g.rooms.map(r=>r.name).join(', ')}): ${g.link ? normalizeUrl(g.link) : 'no link yet'}`)); }
    const text = lines.join('\n');
    const btn = document.getElementById('copy-links-btn');
    try{ await navigator.clipboard.writeText(text); if(btn){ btn.textContent = 'Copied'; setTimeout(()=>{ btn.textContent = 'Copy all links'; }, 1800); } }
    catch(e){
      const ta = document.getElementById('copy-fallback');
      if(ta){ ta.value = text; ta.hidden = false; ta.focus(); ta.select(); }
      if(btn) btn.textContent = 'Select and copy below';
    }
  }

  function render(){
    const A = computeAll();
    const sub = {
      flooring:'Room areas from the floor plan. Try prices in the compare cards, or set each room’s own price.',
      walls:'Each room’s walls: paint surfaces from the Paint Plan costed in real tins, plus tiles or panelling priced per m² where you choose them.',
      combined:'Flooring and walls side by side. Switch either one off to see the other on its own.',
      links:'Every product in one place, grouped as you’d buy it. Paste a link into anything that’s missing one.',
    }[activeTab];
    let html = `
      <header class="app-head stagger">
        <div class="title-row">
          <h1>Flooring &amp; Paint Calculator</h1>
          <span class="version-tag">v5</span>
        </div>
        ${toolbarHtml()}
      </header>
      ${tabsHtml(A)}
      <p class="subhead">${sub}</p>
      <div id="panel" role="tabpanel" aria-labelledby="tab-${activeTab}">
        ${activeTab==='flooring' ? flooringPanel(A) : activeTab==='walls' ? wallsPanel(A) : activeTab==='links' ? linksPanel(A) : combinedPanel(A)}
      </div>`;
    root.innerHTML = html;
    if(activeTab==='flooring' || activeTab==='walls'){
      const T = activeTab==='walls' ? { total:A.W.total, ct:A.W.compareTotals, max:A.W.maxCompare, list:wallCompare } : { total:A.grandTotal, ct:A.compareTotals, max:A.maxCompare, list:compareOptions };
      animateNumbers(T.total, T.ct);
      requestAnimationFrame(()=>T.list.forEach(c=>{
        const bar = document.getElementById('compare-bar-'+c.id);
        if(bar) bar.style.width = (T.max>0 ? Math.max(4, T.ct[c.id]/T.max*100) : 0)+'%';
      }));
    }
  }
  function rerender(){ const y = window.scrollY; render(); window.scrollTo(0, y); }

  function setTab(t){
    if(!TABS.includes(t) || t===activeTab) return;
    activeTab = t;
    try{ localStorage.setItem('fpc-tab', t); }catch(e){}
    try{ history.replaceState(null, '', '#'+t); }catch(e){}
    render();
    const tb = document.getElementById('tab-'+t); if(tb) tb.focus();
  }

  // Lightweight update: patch figures in place; never touches the inputs being typed in.
  function recompute(){
    const A = computeAll();
    const setText = (id, t) => { const el = document.getElementById(id); if(el) el.textContent = t; };
    const setHtml = (id, h) => { const el = document.getElementById(id); if(el) el.innerHTML = h; };
    setText('tabfig-flooring', currency+fmt0(A.grandTotal));
    setText('tabfig-walls', currency+fmt0(A.W.total));
    setText('tabfig-combined', currency+fmt0(A.combinedTotal));
    const lc = linkCounts(A); setText('tabfig-links', `${lc.linked}/${lc.total}`);

    if(activeTab==='flooring'){
      rooms.forEach(r=>{
        setHtml('prodchip-'+r.id, prodChipHtml(r));
        setHtml('cost-'+r.id, `<span class="lbl">Cost</span>${money(roomCost(r))}`);
        const lb = document.getElementById('link-'+r.id);
        if(lb){ const has = !!String(r.productLink||'').trim(); lb.href = has?normalizeUrl(r.productLink):'#'; lb.classList.toggle('disabled', !has); lb.title = has?'Open product page':'Add a link to enable'; }
      });
      FLOORS.forEach(f=>{
        const area = rooms.filter(r=>r.floor===f).reduce((s,r)=>s+(Number(r.area)||0),0);
        setText('subtotal-'+f.replace(/\s/g,''), `${currency}${fmt(A.floorTotals[f]||0)} · ${area.toFixed(1)} m²`);
      });
      setText('section-hint', `Based on the ${A.includedRooms.length} room${A.includedRooms.length===1?'':'s'} ticked below · ${A.includedArea.toFixed(1)} m²`);
      setHtml('hero-breakdown', FLOORS.filter(f=>A.floorTotals[f]).map(f=>`<div class="hero-chip"><span class="dot" style="background:${FLOOR_COLORS[f]}"></span>${f}: ${currency}${fmt(A.floorTotals[f])}</div>`).join('') + `<div class="hero-chip">${A.grandArea.toFixed(1)} m² across ${rooms.length} rooms</div>`);
      setHtml('hero-ring-svg', ringSvgInner(A.floorTotals, FLOOR_COLORS));
      compareOptions.forEach(c=>{
        const isBest = A.minTotal!==null && Number(c.price)>0 && A.compareTotals[c.id]===A.minTotal;
        const card = document.getElementById('compare-card-'+c.id); if(card) card.classList.toggle('is-best', !!isBest);
        const bar = document.getElementById('compare-bar-'+c.id); if(bar) bar.style.width = (A.maxCompare>0 ? Math.max(4, A.compareTotals[c.id]/A.maxCompare*100) : 0)+'%';
      });
      animateNumbers(A.grandTotal, A.compareTotals);
    }

    if(activeTab==='walls'){
      const W = A.W;
      paintLines.forEach(l=>{
        const res = A.lineResults[l.id];
        setHtml('pcostout-'+l.id, money(res.cost));
        if(l.kind!=='other') setHtml('ptins-'+l.id, tinOutHtml(l, res));
        const cw = document.querySelector('#pline-'+l.id+' .colour-wrap'); if(cw) cw.classList.toggle('empty', !String(l.colour||'').trim());
        const slot = document.getElementById('plinkslot-'+l.id); if(slot && document.activeElement !== slot.firstElementChild) slot.innerHTML = linkSlotHtml(l);
      });
      setHtml('assump-summary', assumpSummary());
      paintSettings.tins.forEach((t,i)=>setText('tin-pl-'+i, perLitre(t)));
      wallRooms.forEach(r=>{
        setHtml('wroomtotal-'+r.id, money(W.byRoom[r.id]||0));
        const st = wallStatus(r); const se = document.getElementById('wstatus-'+r.id); if(se){ se.className = 'status-tag '+st.cls; se.textContent = st.label; }
        setHtml('wcost-'+r.id, `<span class="lbl">${escapeHtml(r.wallType)}</span>${money(finishCost(r))}`);
        const lb = document.getElementById('wlinkbtn-'+r.id);
        if(lb){ const has = !!String(r.productLink||'').trim(); lb.href = has?normalizeUrl(r.productLink):'#'; lb.classList.toggle('disabled', !has); }
      });
      FLOORS.forEach(f=>{
        const area = wallRooms.filter(r=>r.floor===f).reduce((s,r)=>s+(Number(r.area)||0),0);
        setText('wsubtotal-'+f.replace(/\s/g,''), `${currency}${fmt(W.floorTotals[f]||0)}`);
      });
      setText('section-hint', `What-if prices per m², across the ${W.included.length} room${W.included.length===1?'':'s'} ticked below · ${W.includedArea.toFixed(1)} m² of wall`);
      setHtml('hero-breakdown', wallChips(A));
      setHtml('hero-ring-svg', ringSvgInner(W.floorTotals, FLOOR_COLORS));
      wallCompare.forEach(c=>{
        const isBest = W.minTotal!==null && Number(c.price)>0 && W.compareTotals[c.id]===W.minTotal;
        const card = document.getElementById('compare-card-'+c.id); if(card) card.classList.toggle('is-best', !!isBest);
        const bar = document.getElementById('compare-bar-'+c.id); if(bar) bar.style.width = (W.maxCompare>0 ? Math.max(4, W.compareTotals[c.id]/W.maxCompare*100) : 0)+'%';
      });
      animateNumbers(W.total, W.compareTotals);
    }

  }

  function animateNumbers(targetTotal, targetCompareTotals){
    if(rafHandle) cancelAnimationFrame(rafHandle);
    const startTotal = displayedTotal, startCompare = { ...displayedCompareTotals };
    const startTime = performance.now(), duration = 550;
    function tick(now){
      const t = Math.min(1, (now-startTime)/duration), ease = 1-Math.pow(1-t,3);
      displayedTotal = startTotal + (targetTotal-startTotal)*ease;
      Object.keys(targetCompareTotals).forEach(id=>{ const s = startCompare[id]||0; displayedCompareTotals[id] = s + (targetCompareTotals[id]-s)*ease; });
      paintNumbers();
      if(t<1) rafHandle = requestAnimationFrame(tick);
      else { displayedTotal = targetTotal; displayedCompareTotals = { ...targetCompareTotals }; paintNumbers(); }
    }
    rafHandle = requestAnimationFrame(tick);
  }
  function paintNumbers(){
    const h = document.getElementById('hero-total-fig'); if(h) h.textContent = currency + fmt(displayedTotal);
    [...compareOptions, ...wallCompare].forEach(c=>{ const el = document.getElementById('compare-total-'+c.id); if(el) el.textContent = currency + fmt(displayedCompareTotals[c.id]||0); });
  }

  /* =====================================================================
     EVENTS (delegated — survive re-renders)
     ===================================================================== */
  root.addEventListener('input', e=>{
    const t = e.target;
    if(t.dataset.id){
      const f = t.dataset.field; let v = t.value;
      if(['area','price','wastage'].includes(f)) v = parseFloat(v)||0;
      updateRoom(t.dataset.id, f, v); return;
    }
    if(t.dataset.wid){
      const f = t.dataset.wfield; let v = t.value;
      if(['height','perimeter','area','price','wastage'].includes(f)) v = parseFloat(v)||0;
      updateWallRoom(t.dataset.wid, f, v); return;
    }
    if(t.dataset.wcompareId){
      let v = t.value; if(t.dataset.wcompareField==='price') v = parseFloat(v)||0;
      updateWallCompare(t.dataset.wcompareId, t.dataset.wcompareField, v); return;
    }
    if(t.dataset.compareId){
      let v = t.value; if(t.dataset.compareField==='price') v = parseFloat(v)||0;
      updateCompare(t.dataset.compareId, t.dataset.compareField, v); return;
    }
    if(t.dataset.pid){
      const f = t.dataset.pfield; let v = t.value;
      if(f==='area' || f==='cost') v = parseFloat(v)||0;
      if(f==='coats') v = t.value==='' ? null : (parseFloat(v)||0);
      updatePaint(t.dataset.pid, f, v); return;
    }
    if(t.dataset.glink){
      const [kind, idx] = t.dataset.glink.split(':'); const g = (kind==='p' ? shownPaintGroups : kind==='w' ? shownWallGroups : shownFloorGroups)[Number(idx)];
      if(!g) return;
      if(kind==='p'){ g.lines.forEach(l=>{ l.link = t.value.trim(); }); save.paint(); }
      else if(kind==='w'){ g.rooms.forEach(r=>{ r.productLink = t.value.trim(); }); save.wallRooms(); }
      else { g.rooms.forEach(r=>{ r.productLink = t.value.trim(); }); save.rooms(); }
      return;
    }
    if(t.dataset.note){
      const v = t.value; if(v.trim()) paintNotes[t.dataset.note] = v; else delete paintNotes[t.dataset.note];
      save.paintNotes(); return;
    }
    if(t.dataset.setting){
      paintSettings[t.dataset.setting] = parseFloat(t.value)||0; save.paintSettings();
      if(t.dataset.setting==='coats') document.querySelectorAll('input[data-pfield="coats"]').forEach(inp=>inp.placeholder = paintSettings.coats);
      recompute(); return;
    }
    if(t.dataset.tin !== undefined){
      const tin = paintSettings.tins[Number(t.dataset.tin)]; if(!tin) return;
      tin[t.dataset.tinfield] = parseFloat(t.value)||0; save.paintSettings(); recompute(); return;
    }
  });

  root.addEventListener('change', e=>{
    const t = e.target;
    if(t.dataset.ftype){
      updateRoom(t.dataset.ftype, 'flooring', t.value);
      t.className = 'type-select ' + tintClass(t.value, compareOptions); return;
    }
    if(t.dataset.wtype){
      updateWallRoom(t.dataset.wtype, 'wallType', t.value); rerender(); return;
    }
    if(t.id==='currency-select'){ currency = t.value; save.currency(); rerender(); return; }
    if(t.id==='import-file-input'){ const f = t.files && t.files[0]; if(f) handleImportFile(f); t.value=''; return; }
    if(t.dataset.glink){ if(t.value.trim()){ rerender(); setStatus('Link saved'); } return; }
    if(t.dataset.pkind){ const l = paintLines.find(x=>x.id===t.dataset.pkind); if(l){ l.kind = t.value==='other'?'other':'paint'; save.paint(); rerender(); } }
  });

  root.addEventListener('click', e=>{
    const b = e.target.closest('button, a'); if(!b || !root.contains(b)) return;
    const d = b.dataset;
    if(b.tagName==='A'){ if(b.classList.contains('disabled')) e.preventDefault(); return; }
    if(d.tab) return setTab(d.tab);
    if(d.toggleInclude) return toggleInclude(d.toggleInclude);
    if(d.remove) return removeRoom(d.remove, b);
    if(d.addFloor) return addRoom(d.addFloor);
    if(d.ptoggle) return togglePaintLine(d.ptoggle);
    if(d.premove) return removePaintLine(d.premove, b);
    if(d.padd) return addPaintLine(d.padd);
    if(d.plinkadd){
      openLines.add(d.plinkadd);
      const pane = document.getElementById('pmore-'+d.plinkadd); if(pane) pane.hidden = false;
      const mb = document.querySelector(`[data-pmore="${d.plinkadd}"]`); if(mb){ mb.classList.add('open'); mb.setAttribute('aria-expanded','true'); }
      const inp = document.getElementById('plink-'+d.plinkadd); if(inp) inp.focus();
      return;
    }
    if(d.wtoggle) return toggleWallInclude(d.wtoggle);
    if(d.wremove) return removeWallRoom(d.wremove, b);
    if(d.addWallFloor) return addWallRoom(d.addWallFloor);
    if(d.wlinkadd){ const inp = document.getElementById('wlink-'+d.wlinkadd); if(inp){ inp.focus(); inp.scrollIntoView({ block:'nearest', behavior:'smooth' }); } return; }
    if(d.flinkadd){ const inp = document.getElementById('rlink-'+d.flinkadd); if(inp){ inp.focus(); inp.scrollIntoView({ block:'nearest', behavior:'smooth' }); } return; }
    if(b.id==='copy-links-btn') return copyAllLinks();
    if(d.pmore){
      const open = !openLines.has(d.pmore); if(open) openLines.add(d.pmore); else openLines.delete(d.pmore);
      const pane = document.getElementById('pmore-'+d.pmore); if(pane) pane.hidden = !open;
      b.classList.toggle('open', open); b.setAttribute('aria-expanded', open); return;
    }
    if(b.id==='menu-btn'){ const pop = document.getElementById('menu-pop'); const open = pop.hidden; pop.hidden = !open; b.setAttribute('aria-expanded', open); return; }
    if(d.combine){ combine[d.combine] = !combine[d.combine]; save.combine(); rerender(); return; }
    if(b.id==='reset-btn') return resetDefaults(b);
    if(b.id==='export-pdf-btn') return generatePDF();
    if(b.id==='export-data-btn'){ closeMenu(); return exportData(); }
    if(b.id==='import-data-btn'){ closeMenu(); const inp = document.getElementById('import-file-input'); if(inp) inp.click(); return; }
  });

  function closeMenu(){ const pop = document.getElementById('menu-pop'); if(pop) pop.hidden = true; const mb = document.getElementById('menu-btn'); if(mb) mb.setAttribute('aria-expanded','false'); }
  document.addEventListener('click', e=>{ if(!e.target.closest || !e.target.closest('.menu')) closeMenu(); });
  document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeMenu(); });
  root.addEventListener('toggle', e=>{
    if(e.target.id==='assump'){ assumpOpen = e.target.open; const ed = e.target.querySelector('.assump-edit'); if(ed) ed.textContent = assumpOpen?'Done':'Edit'; }
  }, true);

  root.addEventListener('keydown', e=>{
    const t = e.target; if(!t.dataset || !t.dataset.tab) return;
    if(e.key!=='ArrowRight' && e.key!=='ArrowLeft') return;
    const i = TABS.indexOf(t.dataset.tab), n = TABS[(i + (e.key==='ArrowRight'?1:TABS.length-1)) % TABS.length];
    e.preventDefault(); setTab(n);
  });

  window.addEventListener('hashchange', ()=>{ const h = location.hash.replace('#',''); if(TABS.includes(h) && h!==activeTab){ activeTab = h; render(); } });

  load();
})();
</script>
